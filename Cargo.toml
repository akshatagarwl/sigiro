[package]
name = "sigiro"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[workspace]
members = ["crates/sigiro-core", "crates/segments", "crates/segments-wasm"]

[workspace.package]
edition = "2024"
# The real floor, not an aspiration: `rusqlite` 0.41.1 requires 1.89,
# so a lower number here does not buy compatibility — it silently costs it.
# Cargo treats `rust-version` as a RESOLVER input, so when this said 1.85 a
# plain `cargo add rmcp` resolved to 2.2.0 instead of 3.x with no warning and
# no error. Keep this equal to the highest MSRV in the dependency tree
# (`cargo metadata` reports it); raise it deliberately when a dependency
# forces it, and never leave it below what the tree already demands.
rust-version = "1.89"
license = "FSL-1.1-ALv2"

[workspace.lints.clippy]
# Disallowed patterns (configured in clippy.toml)
disallowed_methods = "deny"
disallowed_macros = "deny"

# Silent error drops via `let _ = expr_returning_result`
let_underscore_must_use = "deny"

# General quality
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
manual_string_new = "warn"
inefficient_to_string = "warn"

[workspace.lints.rust]
unused_must_use = "deny"
dead_code = "warn"
unused_imports = "warn"

[dependencies]
sigiro-core = { path = "crates/sigiro-core" }
sigiro-segments = { path = "crates/segments" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking", "cookies", "query"] }
dashmap = "6"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
postgres = "0.19"
postgres-native-tls = "0.5"
# Vendored so Linux release binaries cross-compile from macOS without a
# target OpenSSL install; macOS and Windows use their platform TLS instead.
native-tls = { version = "0.2", features = ["vendored"] }

# OTLP ingest
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-types = "0.14"
prost = "0.14"
arrow = "60"
# Linked against the upstream static bundle from scripts/prepare-duckdb-static.sh.
# Keep it feature-free beyond these two: `bundled`, `parquet` and `json` would
# compile DuckDB locally.
duckdb = { version = "=1.20000.1", default-features = false, features = ["appender-arrow", "vscalar"] }
opentelemetry-proto = { version = "0.33", features = ["gen-tonic-messages", "logs", "trace", "metrics", "profiles", "with-serde"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tower-http = { version = "0.7", features = ["compression-full", "decompression-full", "cors", "trace"] }
axum-anyhow = "0.11"
prefixed-api-key = { version = "0.3", features = ["sha2"] }
tower_governor = { version = "0.8", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
nutype = { version = "0.8", features = ["regex", "serde"] }
secrecy = "0.10"
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
# Self-profiling (src/profiling.rs): pprof-rs samples CPU; its `cpp` feature
# demangles DuckDB's native C++ frames. jemalloc_pprof dumps the sampled heap,
# pprof_util parses the dump, and backtrace symbolizes its addresses.
pprof = { version = "0.15", default-features = false, features = ["cpp"] }
jemalloc_pprof = "0.8.2"
pprof_util = "0.8.2"
backtrace = "0.3"
tikv-jemallocator = { version = "0.6.1", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
regex = "1"
hex = "0.4.3"
libc = "0.2.184"
flate2 = "1"
parking_lot = "0.13"
thiserror = "2"
url = "2"
tempfile = "3"
headers = "0.4"
mime = "0.3"
rust-embed = { version = "8.13", features = ["debug-embed"] }
axum-extra = { version = "0.12.6", features = ["typed-routing", "multipart"] }
walkdir = "2"

opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.33.1", features = ["http-proto", "reqwest-blocking-client", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
typed-env = "0.3.0"
utoipa = "6"
camino = "1.2.2"
rmcp = { version = "3.1.2", features = ["client", "server", "macros", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-io", "schemars"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
tokio-metrics = "0.5.1"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
keyring = "4.2.0"
webbrowser = { version = "1.2.4", features = ["hardened"] }
rpassword = "7.4.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
schemars = "1"
tokio-util = "0.7"

[lints]
workspace = true

[profile.dev]
split-debuginfo = "unpacked"
debug = 1

# Dependencies rarely need step-through debugging; dropping their debuginfo
# shrinks target/ (the bulk of the old 66 GB debug dir was dep debuginfo) and
# speeds dep compile+link. Our own crate keeps debug = 1 above.
[profile.dev.package."*"]
debug = false

[profile.release]
# Max runtime optimization (perf is prioritized over build time): thin LTO +
# single codegen unit. Line tables are sufficient for in-process native
# symbolization; extension symbols depend on loading extensions first.
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false

[profile.profiling]
inherits = "release"
debug = true
