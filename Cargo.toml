[package]
name = "sigiro"
version = "0.1.0"
edition = "2021"

[dependencies]
# DuckDB: git main for arrow 58 compat with otlp2records
duckdb = { git = "https://github.com/duckdb/duckdb-rs", branch = "main", features = ["bundled", "appender-arrow"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"

# OTLP ingest
otlp2records = "0.4"
tonic = "0.14"
prost = "0.14"
arrow = "58"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "logs", "trace", "metrics"] }
crossbeam-channel = "0.5"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
