[package]
name = "sigiro"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace]

[dependencies]
# DuckDB: pinned rev for arrow 58 compat with otlp2records (avoids main drift breaking cache)
duckdb = { git = "https://github.com/duckdb/duckdb-rs", rev = "bcadfebcc07bace4967ecd5f80c25f7c6b8f85ea", features = ["bundled", "appender-arrow"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
toon = "0.1.2"

# OTLP ingest
otlp2records = "0.4"
tonic = "0.14"
prost = "0.14"
arrow = "58"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "logs", "trace", "metrics", "profiles"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-full", "cors"] }
axum-anyhow = "0.10"
prefixed-api-key = { version = "0.3", features = ["sha2"] }
tower_governor = { version = "0.8", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
pyroscope = { version = "2.0.0", features = ["backend-pprof-rs"] }
time = { version = "0.3", features = ["formatting"] }
rmcp = { version = "1.2.0", features = ["server", "transport-io"] }
hex = "0.4.3"
libc = "0.2.184"
flate2 = "1"
which = "5"
uuid = "1"
tar = "0.4"
axum-extra = { version = "0.12.6", features = ["typed-routing", "multipart"] }
multer = "3"
futures-util = "0.3"
watchexec-supervisor = "5"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "reqwest-blocking-client", "logs"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"
typed-env = "0.3.0"

[build-dependencies]
ureq = { version = "3", features = ["rustls"] }

[dev-dependencies]
time = { version = "0.3", features = ["formatting"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tower = "0.5"
axum-test = "17"
tracing-test = "0.2"
proptest = "1"
arbitrary = "1"

[[bench]]
name = "investigate_bench"
harness = false

[[bench]]
name = "appender_bench"
harness = false

[lints.clippy]
# Disallowed patterns (configured in clippy.toml)
disallowed-methods = "deny"
disallowed-macros = "deny"

# Silent error drops via `let _ = expr_returning_result`
let-underscore-must-use = "deny"

# General quality
needless-pass-by-value = "warn"
cloned-instead-of-copied = "warn"
redundant-closure-for-method-calls = "warn"
manual-string-new = "warn"
inefficient-to-string = "warn"

[lints.rust]
# Compiler-level: unused Results are errors
unused-must-use = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
