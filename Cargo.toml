[package]
name = "sigiro"
version = "0.1.0"
edition = "2024"
# The real floor, not an aspiration: `rmcp` and `darling` both require 1.88,
# so a lower number here does not buy compatibility — it silently costs it.
# Cargo treats `rust-version` as a RESOLVER input, so when this said 1.85 a
# plain `cargo add rmcp` resolved to 2.2.0 instead of 3.x with no warning and
# no error. Keep this equal to the highest MSRV in the dependency tree
# (`cargo metadata` reports it); raise it deliberately when a dependency
# forces it, and never leave it below what the tree already demands.
rust-version = "1.88"
license = "Apache-2.0"

[workspace]
members = []

[dependencies]
# BOCPD changepoint detection for /diagnose anomaly flags (pure Rust, no Stan)
augurs-changepoint = "0.10.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }

# OTLP ingest
tonic = { version = "0.14", features = ["tls-aws-lc"] }
prost = "0.14"
arrow = "58"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "logs", "trace", "metrics", "profiles", "with-serde"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tower-http = { version = "0.6", features = ["compression-full", "decompression-full", "cors", "trace"] }
axum-anyhow = "0.10"
prefixed-api-key = { version = "0.3", features = ["sha2"] }
tower_governor = { version = "0.8", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
pyroscope = { version = "2.0.0", features = ["backend-jemalloc", "backend-pprof-rs"] }
tikv-jemallocator = { version = "0.6.0", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
regex = "1"
drain3 = "0.3.0"
hex = "0.4.3"
libc = "0.2.184"
flate2 = "1"
which = "5"
parking_lot = "0.12"
thiserror = "2"
url = "2"
tempfile = "3"
headers = "0.4"
mime = "0.3"
sqlparser = { version = "0.53", features = ["visitor"] }
axum-extra = { version = "0.12.6", features = ["typed-routing", "multipart"] }
multer = "3"
futures-util = "0.3"
walkdir = "2"

opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "reqwest-blocking-client", "logs"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"
typed-env = "0.3.0"
utoipa = "5"
validator = { version = "0.20", features = ["derive"] }
axum-valid = "0.23" # default features = basic (json/form/query) + validator
camino = "1.2.2"
itertools = "0.14.0"
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-streamable-http-server", "transport-io", "schemars"] }

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
duckdb = { version = "=1.10505.0", features = ["appender-arrow", "vscalar"] }

# DuckDB does not publish a single self-contained macOS static core archive.
# Keep local development zero-setup; the production Linux build links the
# version-pinned static archive prepared in the Dockerfile instead.
#
# `parquet` and `json` statically link those two extensions INTO the binary, so
# there is no `.duckdb_extension` file to SHA-256 and `dlopen` at every boot.
# Linux already gets this from the merged static archive the Dockerfile builds;
# without these features macOS was the only platform paying for them as files.
# Both resolve to `bundled`, which this target already used — no new build
# backend, no cmake.
#
# `icu` is deliberately NOT here: the duckdb crate routes it through
# `bundled-cmake`, a different build backend that adds a cmake dependency.
# It stays a cached file on macOS, which `extensions_needing_install`
# (src/storage.rs) already resolves at runtime by asking DuckDB.
[target.'cfg(target_os = "macos")'.dependencies]
duckdb = { version = "=1.10505.0", features = [
    "bundled",
    "parquet",
    "json",
    "appender-arrow",
    "vscalar",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
axum-test = "17"
temp-env = "0.3"
insta = { version = "1.47.2", features = ["yaml", "json"] }

[[bench]]
name = "diagnose_bench"
harness = false
test = false

[[bench]]
name = "appender_bench"
harness = false
test = false

[lints.clippy]
# Disallowed patterns (configured in clippy.toml)
disallowed-methods = "deny"
disallowed-macros = "deny"

# Silent error drops via `let _ = expr_returning_result`
let-underscore-must-use = "deny"

# General quality
needless-pass-by-value = "warn"
cloned-instead-of-copied = "warn"
redundant-closure-for-method-calls = "warn"
manual-string-new = "warn"
inefficient-to-string = "warn"

[lints.rust]
unused-must-use = "deny"
dead_code = "warn"
unused_imports = "warn"

[profile.dev]
split-debuginfo = "unpacked"
debug = 1

# Dependencies rarely need step-through debugging; dropping their debuginfo
# shrinks target/ (the bulk of the old 66 GB debug dir was dep debuginfo) and
# speeds dep compile+link. Our own crate keeps debug = 1 above.
[profile.dev.package."*"]
debug = false

[profile.test]
split-debuginfo = "unpacked"
debug = 1

[profile.test.package."*"]
debug = false

[profile.release]
# Max runtime optimization (perf is prioritized over build time): thin LTO +
# single codegen unit. Line tables are sufficient for in-process native
# symbolization; extension symbols depend on loading extensions first.
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false

[profile.profiling]
inherits = "release"
debug = true
