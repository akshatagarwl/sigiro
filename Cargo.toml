[package]
name = "sigiro"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
# DuckDB: git main for arrow 58 compat with otlp2records
duckdb = { git = "https://github.com/duckdb/duckdb-rs", branch = "main", features = ["bundled", "appender-arrow"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
envy = "0.4"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
dashmap = "6"

# OTLP ingest
otlp2records = "0.4"
tonic = "0.14"
prost = "0.14"
arrow = "58"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "logs", "trace", "metrics", "profiles"] }
crossbeam-channel = "0.5"
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-full", "cors"] }
problem_details = { version = "0.9", features = ["axum", "json"] }
prefixed-api-key = { version = "0.3", features = ["sha2"] }
tower_governor = { version = "0.8", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
chrono = "0.4"
rmcp = { version = "1.2.0", features = ["server", "transport-io"] }
hex = "0.4.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "investigate_bench"
harness = false

[[bench]]
name = "appender_bench"
harness = false

[lints.clippy]
# Disallowed patterns (configured in clippy.toml)
disallowed-methods = "deny"
disallowed-macros = "deny"

# Silent error drops via `let _ = expr_returning_result`
let-underscore-must-use = "deny"

# General quality
needless-pass-by-value = "warn"
cloned-instead-of-copied = "warn"
redundant-closure-for-method-calls = "warn"
manual-string-new = "warn"
inefficient-to-string = "warn"

[lints.rust]
# Compiler-level: unused Results are errors
unused-must-use = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
