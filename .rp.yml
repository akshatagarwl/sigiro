version: 1

verify-cmd: cargo test && cargo clippy -- -D warnings

tests:
  - tests/

guidance: |
  sigiro is a Rust observability system: tonic gRPC + axum HTTP + DuckDB in-process.
  Edition 2024, rust-version 1.85.

  Key rules:
  - Never use .ok() or let _ = on error-bearing Results (silent drops are banned).
  - DuckDB is single-writer: Arc<Mutex<Connection>> per project, acquire/release per query.
  - Never hold the DuckDB mutex across multiple queries or async boundaries.
  - Use parameterized SQL queries, never string interpolation for user input.
  - All errors must be propagated with context (anyhow) or logged with tracing::error!
  - Tests go in tests/ directory, not inline.
  - Use cargo fmt --check and cargo clippy -- -D warnings before committing.
  - Prefer DuckDB native capabilities (COPY TO, read_parquet) over custom Rust code.
