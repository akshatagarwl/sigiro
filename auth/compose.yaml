services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: sigiro_auth
      POSTGRES_USER: sigiro
      POSTGRES_PASSWORD: sigiro-kill-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigiro -d sigiro_auth"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
