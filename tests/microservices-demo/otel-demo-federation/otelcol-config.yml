receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317
      http:
        endpoint: otel-collector:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

exporters:
  debug:
    verbosity: detailed
  otlphttp/sigiro:
    endpoint: http://sigiro-collector:4319
    encoding: json
    compression: none
    headers:
      Authorization: Bearer sigiro_dev_test
    tls:
      insecure: true

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

connectors:
  spanmetrics:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/sigiro, debug, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter]
      exporters: [otlphttp/sigiro, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/sigiro, debug]
  telemetry:
    logs:
      level: info
