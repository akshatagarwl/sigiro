services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
    command: /data
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 10

  rustfs-setup:
    image: rustfs/rc:v0.1.30@sha256:1296510ec27800668d26a8bdca6251e587086187a9368c7b80134a169e8a3bb8
    depends_on:
      rustfs: { condition: service_healthy }
    entrypoint: sh -c "rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin && rc bucket create --ignore-existing local/sigiro"

  collector:
    build:
      context: ../..
      dockerfile: collector/Dockerfile
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: sigiro
      S3_REGION: us-east-1
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
    command: ["--config", "/etc/otelcol/otelcol.e2e.yaml", "--feature-gates=service.profilesSupport"]
    volumes:
      - ../../collector/otelcol.e2e.yaml:/etc/otelcol/otelcol.e2e.yaml:ro
    ports:
      - "4040:4040"
      - "4317:4317"
      - "4318:4318"
      - "4319:4319"

  # Pyroscope Go rideshare — sends cpu, alloc_objects, goroutines profiles
  go-app:
    build:
      context: ./pyroscope-examples/golang-push/rideshare
      dockerfile: Dockerfile
    depends_on:
      collector: { condition: service_started }
    environment:
      PYROSCOPE_SERVER_ADDRESS: http://collector:4040
      PYROSCOPE_APPLICATION_NAME: rideshare.go
      REGION: us-east
    ports:
      - "5100:5000"

  # Pyroscope Python rideshare — sends cpu profiles
  python-app:
    build:
      context: ./pyroscope-examples/python/rideshare/flask
      dockerfile: Dockerfile
    depends_on:
      collector: { condition: service_started }
    environment:
      PYROSCOPE_SERVER_ADDRESS: http://collector:4040
      PYROSCOPE_APPLICATION_NAME: rideshare.python
      REGION: us-east
    ports:
      - "5101:5000"

  # Pyroscope Node.js rideshare — sends cpu profiles
  nodejs-app:
    build:
      context: ./pyroscope-examples/nodejs/express
      dockerfile: Dockerfile
    depends_on:
      collector: { condition: service_started }
    environment:
      PYROSCOPE_URL: http://collector:4040
      APP_NAME: rideshare.nodejs
      REGION: us-east
    ports:
      - "5102:5000"

  # Pyroscope Java rideshare — sends cpu profiles via JFR format.
  # No HTTP server — pushes profiles autonomously to collector.
  java-app:
    build:
      context: ./pyroscope-examples/java/rideshare
      dockerfile: Dockerfile
    depends_on:
      collector: { condition: service_started }
    environment:
      PYROSCOPE_SERVER_ADDRESS: http://collector:4040
      PYROSCOPE_APPLICATION_NAME: rideshare.java
      REGION: us-east

  # Load generator — hits /bike, /car, /scooter on each app
  load:
    image: curlimages/curl:latest
    depends_on:
      - go-app
      - python-app
      - nodejs-app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting 10s for apps to start..."
        sleep 10
        echo "Starting load generation..."
        while true; do
          for host in go-app:5000 python-app:5000 nodejs-app:5000; do
            for route in bike car scooter; do
              curl -sf "http://$${host}/$${route}" > /dev/null 2>&1 || true
            done
          done
          sleep 2
        done
