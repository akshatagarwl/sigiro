# Lima template for a sigiro fleet EDGE node.
#
# Used by tests/vm/fleet-e2e.sh to stand up several independent Linux VMs, each
# running `sigiro serve` with the quack query surface, so a federated
# `sys_*` fleet query is answered by genuinely DIFFERENT hosts — different
# hostnames, different disk sizes, different memory totals.
#
# That difference is the whole point: two edges co-located on one machine
# report an identical mount table, so they cannot prove the per-node
# attribution a real multi-node cluster needs. Disk/memory are deliberately
# parameterized (see fleet-e2e.sh) rather than fixed here.
images:
  - location: "https://cloud-images.ubuntu.com/releases/questing/release/ubuntu-25.10-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/questing/release/ubuntu-25.10-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 2
# Overridden per-node by fleet-e2e.sh via `limactl create --memory/--disk`.
memory: "2GiB"
disk: "12GiB"

# The sigiro binary is copied in with `limactl copy`, so no host mount is
# needed. Keeping mounts empty avoids the 9p/virtiofs write path entirely.
mounts: []

# vz (Virtualization.framework) — same VMType as the existing agent-dev VM.
vmType: "vz"

# No containerd: these VMs run a single static binary, nothing else.
containerd:
  system: false
  user: false
