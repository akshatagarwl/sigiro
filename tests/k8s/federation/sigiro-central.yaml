apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigiro-central
  namespace: sigiro-fed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sigiro-central
  template:
    metadata:
      labels:
        app: sigiro-central
    spec:
      containers:
        - name: sigiro-central
          image: sigiro-collector:local
          imagePullPolicy: Never
          command: ["sigiro"]
          args:
            - serve
            - --no-ebpf
          env:
            - name: SIGIRO_CENTRAL
              value: "true"
            - name: SIGIRO_CATALOG_URL
              value: postgresql://sigiro:sigiro_pass@postgresql.sigiro-fed.svc:5432/sigiro_fed
            - name: SIGIRO_HTTP_PORT
              value: "9999"
            - name: SIGIRO_OTLP_HTTP_PORT
              value: "4318"
            - name: SIGIRO_QUACK_PORT
              value: "5432"
            - name: SIGIRO_QUACK_TOKEN
              value: fed-token-central
            - name: SIGIRO_API_KEY
              value: sigiro_dev_test
            - name: SIGIRO_DATA_DIR
              value: /var/lib/sigiro
            - name: SIGIRO_HOST
              value: 0.0.0.0
          ports:
            - containerPort: 9999
            - containerPort: 4318
          volumeMounts:
            - name: sigiro-data
              mountPath: /var/lib/sigiro
          resources:
            limits:
              memory: 512Mi
      volumes:
        - name: sigiro-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sigiro-central
  namespace: sigiro-fed
spec:
  selector:
    app: sigiro-central
  ports:
    - name: http
      port: 9999
    - name: otlp-http
      port: 4318
    - name: quack
      port: 5432
