apiVersion: v1
kind: ServiceAccount
metadata:
  name: sigiro-collector
  namespace: sigiro-fed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sigiro-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sigiro-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sigiro-collector
subjects:
  - kind: ServiceAccount
    name: sigiro-collector
    namespace: sigiro-fed
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sigiro-collector
  namespace: sigiro-fed
spec:
  selector:
    matchLabels:
      app: sigiro-collector
  template:
    metadata:
      labels:
        app: sigiro-collector
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: sigiro-collector
      containers:
        - name: sigiro-collector
          image: sigiro-collector:local
          imagePullPolicy: Never
          command: ["sigiro"]
          args:
            - serve
          securityContext:
            privileged: true
          env:
            - name: SIGIRO_API_KEY
              value: sigiro_dev_test
            - name: SIGIRO_DATA_DIR
              value: /var/lib/sigiro
            - name: SIGIRO_HTTP_PORT
              value: "9999"
            - name: SIGIRO_OTLP_HTTP_PORT
              value: "4318"
            - name: SIGIRO_CATALOG_URL
              value: postgresql://sigiro:sigiro_pass@postgresql.sigiro-fed.svc:5432/sigiro_fed
            - name: SIGIRO_EBPF
              value: "true"
            - name: SIGIRO_CENTRAL_URL
              value: http://sigiro-central.sigiro-fed.svc:9999
          ports:
            - containerPort: 4318
              hostPort: 4318
              protocol: TCP
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tracefs
              mountPath: /sys/kernel/tracing
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
---
apiVersion: v1
kind: Service
metadata:
  name: sigiro-collector
  namespace: sigiro-fed
spec:
  selector:
    app: sigiro-collector
  ports:
    - name: otlp-http
      port: 4318
