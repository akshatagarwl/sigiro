apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: sigiro-fed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: sigiro-fed
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: sigiro-fed
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: busybox
          command: ["sh", "-c", "until wget -qO- http://minio:9000/minio/health/ready; do sleep 2; done"]
      containers:
        - name: mc
          image: minio/mc
          command: ["sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/sigiro --ignore-existing"]
