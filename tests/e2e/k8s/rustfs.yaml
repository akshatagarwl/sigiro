apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: sigiro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
          command: ["rustfs", "/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              value: rustfsadmin
            - name: RUSTFS_SECRET_KEY
              value: rustfsadmin
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: sigiro
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-setup
  namespace: sigiro
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-rustfs
          image: busybox
          command: ["sh", "-c", "until wget -qO- http://rustfs:9000/health/ready; do sleep 2; done"]
      containers:
        - name: rc
          image: rustfs/rc:v0.1.30@sha256:1296510ec27800668d26a8bdca6251e587086187a9368c7b80134a169e8a3bb8
          command: ["sh", "-c", "rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin && rc bucket create --ignore-existing local/sigiro"]
