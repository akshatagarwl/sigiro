apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: sigiro
data:
  otelcol.k8s.yaml: |
    receivers:
      otelarrow:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4319
          http:
            endpoint: 0.0.0.0:4318

      profiling:
        samples_per_second: 20
        tracers: all
        reporter_interval: 5s

    processors:
      batch:
        timeout: 5s

      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.container.name
            - container.id
            - container.image.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: container.id
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

    extensions:
      file_storage/queue:
        directory: /var/lib/sigiro/queue
        create_directory: true
        compaction:
          on_rebound: true

    exporters:
      unified_parquet:
        s3_bucket: ${env:S3_BUCKET}
        s3_region: ${env:S3_REGION:-us-east-1}
        s3_endpoint: ${env:S3_ENDPOINT}
        s3_access_key: ${env:S3_ACCESS_KEY}
        s3_secret_key: ${env:S3_SECRET_KEY}
        sending_queue:
          storage: file_storage/queue
      debug:
        verbosity: basic

    service:
      extensions: [file_storage/queue]
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [otelarrow, otlp]
          processors: [k8s_attributes, batch]
          exporters: [unified_parquet, debug]
        traces:
          receivers: [otelarrow, otlp]
          processors: [k8s_attributes, batch]
          exporters: [unified_parquet, debug]
        logs:
          receivers: [otelarrow, otlp]
          processors: [k8s_attributes, batch]
          exporters: [unified_parquet, debug]
        profiles:
          receivers: [otlp, profiling]
          processors: [k8s_attributes]
          exporters: [unified_parquet, debug]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sigiro-collector
  namespace: sigiro
spec:
  selector:
    matchLabels:
      app: sigiro-collector
  template:
    metadata:
      labels:
        app: sigiro-collector
    spec:
      hostPID: true
      serviceAccountName: sigiro-collector
      containers:
        - name: collector
          image: sigiro-collector:local
          imagePullPolicy: Never
          args:
            - --config
            - /etc/otelcol/otelcol.k8s.yaml
            - --feature-gates=service.profilesSupport
          securityContext:
            privileged: true
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: S3_ENDPOINT
              value: http://rustfs.sigiro.svc:9000
            - name: S3_BUCKET
              value: sigiro
            - name: S3_REGION
              value: us-east-1
            - name: S3_ACCESS_KEY
              value: rustfsadmin
            - name: S3_SECRET_KEY
              value: rustfsadmin
          ports:
            - containerPort: 4317
              hostPort: 4317
              protocol: TCP
            - containerPort: 4318
              hostPort: 4318
              protocol: TCP
            - containerPort: 4319
              hostPort: 4319
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: queue
              mountPath: /var/lib/sigiro/queue
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tracefs
              mountPath: /sys/kernel/tracing
      volumes:
        - name: config
          configMap:
            name: collector-config
        - name: queue
          emptyDir: {}
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
---
apiVersion: v1
kind: Service
metadata:
  name: sigiro-collector
  namespace: sigiro
spec:
  selector:
    app: sigiro-collector
  ports:
    - name: otelarrow
      port: 4317
    - name: otlp-http
      port: 4318
    - name: otlp-grpc
      port: 4319
