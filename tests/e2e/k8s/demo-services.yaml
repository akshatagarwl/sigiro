# OTel demo services (14) — translated from test/e2e/docker-compose.real.yaml
# All otel-collector references → sigiro-collector (K8s service name)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-go-config
  namespace: sigiro
data:
  otel-config.yml: |
    file_format: "1.0-rc.3"
    disabled: false
    log_level: info
    logger_provider:
      processors:
        - batch:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    meter_provider:
      readers:
        - periodic:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
                temporality_preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
    tracer_provider:
      processors:
        - batch:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    propagator:
      composite:
        - tracecontext:
        - baggage:
    resource:
      attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
      detection/development:
        detectors:
          - container:
          - process:
          - service:

# --- ad ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad
  namespace: sigiro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ad
  template:
    metadata:
      labels:
        app: ad
    spec:
      containers:
        - name: ad
          image: ghcr.io/open-telemetry/demo:2.2.0-ad
          env:
            - name: AD_PORT
              value: "9555"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://sigiro-collector:4318
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_SERVICE_NAME
              value: ad
          ports:
            - containerPort: 9555
          resources:
            limits:
              memory: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ad
  namespace: sigiro
spec:
  selector:
    app: ad
  ports:
    - port: 9555

