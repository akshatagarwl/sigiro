# --- product-catalog ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: sigiro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
    spec:
      containers:
        - name: product-catalog
          image: ghcr.io/open-telemetry/demo:2.2.0-product-catalog
          env:
            - name: PRODUCT_CATALOG_PORT
              value: "3550"
            - name: DB_CONNECTION_STRING
              value: "postgres://otelu:otelp@postgresql:5432/product-catalog?sslmode=disable"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: GOMEMLIMIT
              value: 16MiB
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://sigiro-collector:4317
            - name: OTEL_SERVICE_NAME
              value: product-catalog
            - name: OTEL_EXPERIMENTAL_CONFIG_FILE
              value: /otel-config.yml
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: database
          ports:
            - containerPort: 3550
          resources:
            limits:
              memory: 20Mi
          volumeMounts:
            - name: otel-config
              mountPath: /otel-config.yml
              subPath: otel-config.yml
      volumes:
        - name: otel-config
          configMap:
            name: otel-go-config
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: sigiro
spec:
  selector:
    app: product-catalog
  ports:
    - port: 3550

