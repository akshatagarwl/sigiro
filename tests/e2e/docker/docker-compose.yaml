services:
  sigiro:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - SIGIRO_API_KEY=sigiro_dev_e2e_test
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - SIGIRO_PYROSCOPE_ENDPOINT=http://localhost:4318
      - SIGIRO_OTEL_AUTH_KEY=sigiro_dev_e2e_test
      - OTEL_SERVICE_NAME=sigiro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9999:9999"
    volumes:
      - sigiro-data:/var/lib/sigiro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  sigiro-data:
