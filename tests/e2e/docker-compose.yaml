services:
  sigiro:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - SIGIRO_PYROSCOPE_ENDPOINT=http://localhost:4318
      - OTEL_SERVICE_NAME=sigiro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9999:9999"
    volumes:
      - sigiro-data:/var/lib/sigiro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 5s
      retries: 10

volumes:
  sigiro-data:
