# Sigiro federation central node
# Receives pre-built binary from host via limactl copy.

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 2
memory: "2GiB"
disk: "20GiB"

ssh:
  localPort: 0

networks:
- vzNAT: true

portForwards:
- guestPort: 9999
  hostIP: "0.0.0.0"
  hostPort: 10000

containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y curl ca-certificates jq
