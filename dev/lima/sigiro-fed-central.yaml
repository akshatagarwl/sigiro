# Sigiro federation central node — bare-metal PostgreSQL + sigiro serve --central
#
# No k8s needed for this VM. PostgreSQL runs as systemd service,
# and sigiro-central runs bare-metal on port 9999.
#
# Usage:
#   limactl start --name=fed-central dev/lima/sigiro-fed-central.yaml
#   limactl copy target/aarch64-unknown-linux-gnu/release/sigiro fed-central:~/sigiro/bin/sigiro
#   limactl shell fed-central ~/sigiro/bin/run-central.sh

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 4
memory: "4GiB"
disk: "60GiB"

ssh:
  localPort: 0

# Port forwarding so other Lima VMs can reach central via host.lima.internal
portForwards:
- guestPort: 9999
  hostIP: "0.0.0.0"
- guestPort: 4318
  hostIP: "0.0.0.0"
- guestPort: 5433
  hostPort: 15432
  hostIP: "0.0.0.0"

containerd:
  system: false
  user: false

mounts:
- location: "{{.Home}}/sigiro"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    apt-get update
    apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git gnupg lsb-release postgresql postgresql-client

    # Start PostgreSQL for federation catalog
    systemctl enable --now postgresql
    su - postgres -c "createuser -s sigiro 2>/dev/null || true"
    su - postgres -c "createdb sigiro_fed 2>/dev/null || true"
    su - postgres -c "psql -c \"ALTER USER sigiro WITH PASSWORD 'sigiro_pass';\" 2>/dev/null || true"

    # Create sigiro user and data dir
    useradd -m -s /bin/bash sigiro || true
    mkdir -p /home/sigiro/sigiro-data
    chown sigiro:sigiro /home/sigiro/sigiro-data

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    VM_HOME="$(eval echo ~"$(whoami)")"
    mkdir -p "${VM_HOME}/sigiro/bin" "${VM_HOME}/sigiro/data"
    cat > "${VM_HOME}/sigiro/bin/run-central.sh" << 'RUNCENTRAL'
    #!/bin/bash
    set -eux -o pipefail

    VM_HOME="$(eval echo ~"$(whoami)")"
    export SIGIRO_DATA_DIR="${VM_HOME}/sigiro/data"
    export SIGIRO_HTTP_PORT=9999
    export SIGIRO_OTLP_HTTP_PORT=4318
    export SIGIRO_GRPC_PORT=4317
    export SIGIRO_CENTRAL=true
    export SIGIRO_CATALOG_URL=postgresql://sigiro:sigiro_pass@localhost:5432/sigiro_fed
    export SIGIRO_QUACK_PORT=5433
    export SIGIRO_QUACK_TOKEN=fed-token-central
    export SIGIRO_API_KEY=sigiro_dev_test
    export SIGIRO_HOST=0.0.0.0

    mkdir -p "${SIGIRO_DATA_DIR}"
    cd "${VM_HOME}/sigiro/bin"
    exec ./sigiro serve
    RUNCENTRAL
    chmod +x "${VM_HOME}/sigiro/bin/run-central.sh"
