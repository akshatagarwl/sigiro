# Sigiro federation central node — k3s server + sigiro serve --central
#
# Usage:
#   limactl start --name=fed-central dev/lima/sigiro-fed-central.yaml
#   limactl copy target/aarch64-unknown-linux-gnu/release/sigiro fed-central:/home/akshat.guest/sigiro
#   limactl shell fed-central /home/akshat.guest/run-central.sh

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 4
memory: "4GiB"
disk: "60GiB"

ssh:
  localPort: 0

containerd:
  system: false
  user: false

mounts:
- location: "~/workspace"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    apt-get update
    apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git gnupg lsb-release

    # Install k3s server (single-node, then workers will join)
    curl -sfL https://get.k3s.io | K3S_KUBECONFIG_MODE="644" sh -s - server --cluster-init --tls-san 127.0.0.1 --tls-san localhost --tls-san host.lima.internal

    # Wait for k3s to be active
    sleep 10
    until systemctl is-active --quiet k3s; do sleep 2; done

    # Install PostgreSQL for federation catalog
    apt-get install -y postgresql postgresql-client
    systemctl enable --now postgresql
    su - postgres -c "createuser -s sigiro 2>/dev/null || true"
    su - postgres -c "createdb sigiro_fed 2>/dev/null || true"

    # Create sigiro user and data dir
    useradd -m -s /bin/bash sigiro || true
    mkdir -p /home/sigiro/sigiro-data
    chown sigiro:sigiro /home/sigiro/sigiro-data

- mode: user
  script: |
    #!/bin/bash
    cat > /home/akshat.guest/run-central.sh << 'RUNCENTRAL'
    #!/bin/bash
    set -eux -o pipefail

    export SIGIRO_DATA_DIR=/home/sigiro/sigiro-data
    export SIGIRO_HTTP_PORT=9999
    export SIGIRO_OTLP_HTTP_PORT=4318
    export SIGIRO_GRPC_PORT=4317
    export SIGIRO_CENTRAL=true
    export SIGIRO_CATALOG_URL=postgresql://sigiro@localhost/sigiro_fed
    export SIGIRO_QUACK_PORT=5432
    export SIGIRO_QUACK_TOKEN=fed-token-central
    export SIGIRO_API_KEY=sigiro_dev_test
    export SIGIRO_HOST=0.0.0.0

    cd /home/akshat.guest
    ./sigiro serve --no-ebpf 2>&1 | tee /tmp/sigiro-central.log
    RUNCENTRAL
    chmod +x /home/akshat.guest/run-central.sh
