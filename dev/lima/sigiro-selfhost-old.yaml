# Sigiro "old" instance — acts as the diagnosis backend
# Runs on default ports: HTTP 9999, gRPC 4317, OTLP HTTP 4318
#
# Usage:
#   limactl start --name=sigiro-selfhost-old dev/lima/sigiro-selfhost-old.yaml
#   limactl copy target/aarch64-unknown-linux-gnu/release/sigiro sigiro-selfhost-old:~/sigiro/bin/sigiro
#   limactl shell sigiro-selfhost-old ~/sigiro/bin/run-old.sh

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 2
memory: "4GiB"
disk: "40GiB"

ssh:
  localPort: 0

containerd:
  system: false
  user: false

mounts:
- location: "{{.Home}}/sigiro"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git

    # Install Rust (aarch64-linux-gnu target pre-installed)
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    /root/.cargo/bin/rustup target add aarch64-unknown-linux-gnu

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    VM_HOME="$(eval echo ~"$(whoami)")"
    mkdir -p "${VM_HOME}/sigiro/bin"
    cat > "${VM_HOME}/sigiro/bin/run-old.sh" << 'RUNOLD'
    #!/bin/bash
    set -eux -o pipefail
    VM_HOME="$(eval echo ~"$(whoami)")"
    export SIGIRO_DATA_DIR=/tmp/sigiro-old
    mkdir -p "$SIGIRO_DATA_DIR"
    cd "${VM_HOME}/sigiro/bin"
    ./sigiro serve 2>&1 | tee /tmp/sigiro-old.log
    RUNOLD
    chmod +x "${VM_HOME}/sigiro/bin/run-old.sh"
