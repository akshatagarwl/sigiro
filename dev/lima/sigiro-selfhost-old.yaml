# Sigiro "old" instance — acts as the investigation backend
# Runs on default ports: HTTP 9999, gRPC 4317, OTLP HTTP 4318
#
# Usage:
#   limactl start --name=sigiro-selfhost-old dev/lima/sigiro-selfhost-old.yaml
#   limactl copy ./result/bin/sigiro sigiro-selfhost-old:/home/akshat.guest/sigiro
#   limactl shell sigiro-selfhost-old /home/akshat.guest/run-old.sh

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 2
memory: "4GiB"
disk: "40GiB"

ssh:
  localPort: 0

containerd:
  system: false
  user: false

mounts:
- location: "../.."
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git

    # Install Rust (aarch64-linux-gnu target pre-installed)
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    /root/.cargo/bin/rustup target add aarch64-unknown-linux-gnu

- mode: user
  script: |
    #!/bin/bash
    cat > /home/akshat.guest/run-old.sh << 'RUNOLD'
    #!/bin/bash
    set -eux -o pipefail
    cd /home/akshat.guest
    export SIGIRO_DATA_DIR=/tmp/sigiro-old
    mkdir -p "$SIGIRO_DATA_DIR"
    ./sigiro serve --no-ebpf 2>&1 | tee /tmp/sigiro-old.log
    RUNOLD
    chmod +x /home/akshat.guest/run-old.sh
