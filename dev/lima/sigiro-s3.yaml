# Sigiro S3 storage VM (RustFS + PostgreSQL)
#
# Usage:
#   limactl start --name=sigiro-s3 dev/lima/sigiro-s3.yaml
#
# Cross-compile and copy binary:
#   source scripts/lima-cross-env.sh
#   TARGET=aarch64-unknown-linux-gnu mise run build
#   limactl copy target/aarch64-unknown-linux-gnu/release/sigiro sigiro-s3:~/sigiro/bin/sigiro

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 2
memory: "2GiB"
disk: "40GiB"

ssh:
  localPort: 0

containerd:
  system: false
  user: false

mounts:
- location: "{{.Home}}/sigiro"
  writable: true

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y build-essential pkg-config libssl-dev git curl ca-certificates unzip postgresql postgresql-client

    case "$(dpkg --print-architecture)" in
      arm64)
        rustfs_arch=aarch64
        rc_arch=arm64
        rustfs_sha=f38139a2fa1917de3fef4df736785868b217ecae7d4bf4d6ff733013168b6ca3
        rc_sha=acb577dfbaec7eadb455487c381e2c58a82328d45ae3a3db3a0042ddb3a53166
        ;;
      amd64)
        rustfs_arch=x86_64
        rc_arch=amd64
        rustfs_sha=3ee8df71e8edcfada533be452c4135868f697bc515460ae97b027313eade7a3d
        rc_sha=5cb30b587ece5a0d03539c3130e3c1cf4fb0c542511fc6e317d74e420a372c49
        ;;
      *) echo "Unsupported architecture: $(dpkg --print-architecture)" >&2; exit 1 ;;
    esac

    workdir=$(mktemp -d /tmp/rustfs-provision.XXXXXX)
    trap 'rm -rf "$workdir"' EXIT
    rustfs_archive="rustfs-linux-${rustfs_arch}-gnu-v1.0.0-rc.5.zip"
    curl -fsSL "https://github.com/rustfs/rustfs/releases/download/1.0.0-rc.5/${rustfs_archive}" -o "$workdir/$rustfs_archive"
    echo "${rustfs_sha}  $workdir/$rustfs_archive" | sha256sum -c -
    unzip -oq "$workdir/$rustfs_archive" -d "$workdir/rustfs"
    install -m 0755 "$workdir/rustfs/rustfs" /usr/local/bin/rustfs

    rc_archive="rustfs-cli-linux-${rc_arch}-gnu-v0.1.30.tar.gz"
    curl -fsSL "https://github.com/rustfs/cli/releases/download/v0.1.30/${rc_archive}" -o "$workdir/$rc_archive"
    echo "${rc_sha}  $workdir/$rc_archive" | sha256sum -c -
    tar -xzf "$workdir/$rc_archive" -C "$workdir"
    install -m 0755 "$workdir/rc" /usr/local/bin/rc

    useradd -r -s /bin/false rustfs-user 2>/dev/null || true
    mkdir -p /data/rustfs
    chown rustfs-user:rustfs-user /data/rustfs
