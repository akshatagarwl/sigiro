# Sigiro S3 storage E2E test VM (MinIO + PostgreSQL)
#
# Usage:
#   limactl start --name=sigiro-s3 dev/lima/sigiro-s3.yaml
#
# Cross-compile and copy binary:
#   ulimit -n 65536 && \
#     AR_aarch64_unknown_linux_gnu=/opt/homebrew/opt/llvm/bin/llvm-ar \
#     cargo zigbuild --release --target aarch64-unknown-linux-gnu
#   limactl copy target/aarch64-unknown-linux-gnu/release/sigiro sigiro-s3:/home/akshat.guest/sigiro-latest
#
# Run E2E test:
#   limactl copy tests/lima-e2e-test.sh sigiro-s3:/tmp/lima-e2e-test.sh
#   limactl shell sigiro-s3 bash -c \
#     'SIGIRO_BIN=/home/akshat.guest/sigiro-latest MODE=s3 \
#      SIGIRO_DATA=/tmp/sigiro-e2e-test bash /tmp/lima-e2e-test.sh'

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 2
memory: "2GiB"
disk: "40GiB"

ssh:
  localPort: 0

containerd:
  system: false
  user: false

mounts:
- location: "<REPO_ROOT>"
  writable: true

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y build-essential pkg-config libssl-dev git curl ca-certificates postgresql postgresql-client
    # Install MinIO server
    curl -sL https://dl.min.io/server/minio/release/linux-arm64/minio -o /usr/local/bin/minio
    chmod +x /usr/local/bin/minio
    useradd -r -s /bin/false minio-user 2>/dev/null || true
    mkdir -p /data/minio
    chown minio-user:minio-user /data/minio
    # Install MinIO client
    curl -sL https://dl.min.io/client/mc/release/linux-arm64/mc -o /usr/local/bin/mc
    chmod +x /usr/local/bin/mc
