# Sigiro "new" instance — self-hosted collector that exports to "old"
# Uses different ports to avoid conflict, points OTLP to old instance
#
# Usage:
#   limactl start --name=sigiro-selfhost-new dev/lima/sigiro-selfhost-new.yaml
#   limactl copy target/aarch64-unknown-linux-gnu/release/sigiro sigiro-selfhost-new:~/sigiro/bin/sigiro
#   limactl shell sigiro-selfhost-new ~/sigiro/bin/run-new.sh

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 4
memory: "4GiB"
disk: "40GiB"

ssh:
  localPort: 0

containerd:
  system: false
  user: false

mounts:
- location: "{{.Home}}/sigiro"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git

    # Install Rust
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    /root/.cargo/bin/rustup target add aarch64-unknown-linux-gnu

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    VM_HOME="$(eval echo ~"$(whoami)")"
    mkdir -p "${VM_HOME}/sigiro/bin"
    cat > "${VM_HOME}/sigiro/bin/run-new.sh" << 'RUNNEW'
    #!/bin/bash
    set -eux -o pipefail
    VM_HOME="$(eval echo ~"$(whoami)")"
    cd "${VM_HOME}/sigiro/bin"

    # Ports for the "new" Sigiro instance (different from old)
    export SIGIRO_DATA_DIR=/tmp/sigiro-new
    export SIGIRO_HTTP_PORT=9989
    export SIGIRO_GRPC_PORT=4316
    export SIGIRO_OTLP_HTTP_PORT=4315

    # Point Sigiro OTLP export at the "old" instance
    export OTEL_EXPORTER_OTLP_ENDPOINT=http://10.0.0.2:4317
    export SIGIRO_PYROSCOPE_ENDPOINT=http://10.0.0.2:9999

    mkdir -p "$SIGIRO_DATA_DIR"

    ./sigiro serve 2>&1 | tee /tmp/sigiro-new.log
    RUNNEW
    chmod +x "${VM_HOME}/sigiro/bin/run-new.sh"
