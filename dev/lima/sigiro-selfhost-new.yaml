# Sigiro "new" instance — self-hosts using obi instrumentation, sends to "old"
# Uses different ports to avoid conflict, points OTLP to old instance
#
# Usage:
#   limactl start --name=sigiro-selfhost-new dev/lima/sigiro-selfhost-new.yaml
#   limactl copy ./result/bin/sigiro sigiro-selfhost-new:/home/akshat.guest/sigiro
#   limactl copy dev/lima/obi-{linux,arm64} sigiro-selfhost-new:/home/akshat.guest/ 2>/dev/null || true
#   limactl shell sigiro-selfhost-new /home/akshat.guest/run-new.sh

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 4
memory: "4GiB"
disk: "40GiB"

ssh:
  localPort: 0

containerd:
  system: false
  user: false

mounts:
- location: "../.."
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git bpfcc-tools linux-headers-generic

    # Install Rust
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    /root/.cargo/bin/rustup target add aarch64-unknown-linux-gnu

- mode: user
  script: |
    #!/bin/bash
    cat > /home/akshat.guest/run-new.sh << 'RUNNEW'
    #!/bin/bash
    set -eux -o pipefail
    cd /home/akshat.guest

    # Ports for the "new" Sigiro instance (different from old)
    export SIGIRO_DATA_DIR=/tmp/sigiro-new
    export SIGIRO_HTTP_PORT=9989
    export SIGIRO_GRPC_PORT=4316
    export SIGIRO_OTLP_HTTP_PORT=4315

    # Point obi/Sigiro OTLP export at the "old" instance
    export SIGIRO_OTEL_ENDPOINT=http://10.0.0.2:4317
    export SIGIRO_PYROSCOPE_ENDPOINT=http://10.0.0.2:9999

    mkdir -p "$SIGIRO_DATA_DIR"

    # Run with eBPF — obi will instrument this new Sigiro process
    # and send traces to the old Sigiro instance
    ./sigiro serve --ebpf 2>&1 | tee /tmp/sigiro-new.log
    RUNNEW
    chmod +x /home/akshat.guest/run-new.sh
