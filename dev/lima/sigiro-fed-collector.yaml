# Sigiro federation collector — bare-metal node that self-registers with fed-central
#
# Usage:
#   1. limactl start --name=fed-collector-1 dev/lima/sigiro-fed-collector.yaml
#   2. limactl copy target/aarch64-unknown-linux-gnu/release/sigiro fed-collector-1:~/sigiro/bin/sigiro
#   3. limactl shell fed-collector-1 ~/sigiro/bin/run-collector.sh

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 4
memory: "4GiB"
disk: "60GiB"

ssh:
  localPort: 0

# Port forwarding so central VM can reach this collector via host.lima.internal
portForwards:
- guestPort: 9999
  hostIP: "0.0.0.0"
- guestPort: 4318
  hostIP: "0.0.0.0"
- guestPort: 5432
  hostIP: "0.0.0.0"

containerd:
  system: false
  user: false

mounts:
- location: "{{.Home}}/sigiro"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    apt-get update
    apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git

    # Create sigiro user and data directory
    useradd -m -s /bin/bash sigiro || true
    mkdir -p /home/sigiro/sigiro-data
    chown sigiro:sigiro /home/sigiro/sigiro-data

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    VM_HOME="$(eval echo ~"$(whoami)")"
    mkdir -p "${VM_HOME}/sigiro/bin"
    cat > "${VM_HOME}/sigiro/bin/run-collector.sh" << 'RUNCOLLECTOR'
    #!/bin/bash
    set -eux -o pipefail

    VM_HOME="$(eval echo ~"$(whoami)")"
    cd "${VM_HOME}/sigiro/bin"

    # Federation collector configuration
    export SIGIRO_DATA_DIR=/home/sigiro/sigiro-data
    export SIGIRO_HTTP_PORT=9999
    export SIGIRO_OTLP_HTTP_PORT=4318
    export SIGIRO_CENTRAL_URL=http://host.lima.internal:9999
    export SIGIRO_API_KEY=sigiro_dev_test
    export SIGIRO_QUACK_PORT=5432
    export SIGIRO_QUACK_TOKEN=fed-token-central

    # SIGIRO_ENDPOINT and SIGIRO_QUACK_ADVERTISE_PORT are set by the test script
    # based on the host port-forward mapping for this VM.

    ./sigiro serve 2>&1 | tee /tmp/sigiro-collector.log
    RUNCOLLECTOR
    chmod +x "${VM_HOME}/sigiro/bin/run-collector.sh"
