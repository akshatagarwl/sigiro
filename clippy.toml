# Configuration for the clippy lints denied in `Cargo.toml [lints.clippy]`.
#
# THIS FILE IS LOAD-BEARING AND ITS ABSENCE IS SILENT. `disallowed-methods` and
# `disallowed-macros` are `deny` in Cargo.toml, but the deny only has teeth if
# this file supplies the list. With no clippy.toml the list is empty, the lint
# matches nothing, and `cargo clippy -- -D warnings` passes on every banned
# call. That is exactly what happened: this file was deleted in 0ba1ffd
# ("chore: delete dead files, clean comments, reorganize configs", 2026-05-30)
# and the Cargo.toml deny lines were left pointing at nothing, so the gate was
# inert for ten weeks and drift landed in client.rs and inserter.rs. Do not
# delete it again without also removing those deny lines.
#
# Two of the three thresholds the original file carried are deliberately NOT
# restored: `too-many-lines-threshold` and `cognitive-complexity-threshold`
# configure lints that live in clippy::pedantic/nursery, and Cargo.toml enables
# neither — so both lines set a limit for a lint that never runs, which reads as
# enforcement and is not. Add the lint to Cargo.toml first if you want them.

# --- Function argument ceiling ---
# Tiger Style's ideal is 4; 5 is the pragmatic ceiling this project adopted.
# Clippy's own default is 7, so this is a real tightening and it is enforced:
# `too_many_arguments` is in the default `complexity` group, which `-D warnings`
# escalates to an error.
#
# Restoring it was staged rather than done in one step, because when clippy.toml
# came back two 6-argument functions had landed under the default of 7:
#
#   `serve_http_app` (server.rs) — FIXED. It took an `IpAddr` and a `u16` whose
#   only use was `SocketAddr::new` on its first line, and both callers held a
#   port local that existed only to be passed in. Now takes the `SocketAddr`:
#   6 params to 4, two locals removed. Worth doing independently of this lint.
#
#   `span_drill_sql` (anomaly.rs) — EXEMPTED, with the reason at the call site.
#   Its `shift` argument is the caller's loop variable while `prefix`/`service`
#   are loop-invariant, so the obvious context struct would be rebuilt every
#   iteration. That is an abstraction with no reader, which AGENTS.md rules out.
#
# The ceiling is live for all new code. Every current exception carries its
# reason at the definition:
#
#   src/anomaly.rs   span_drill_sql    (6) — see above
#   src/server.rs    dfs               (7) — pre-existing, nested recursive walk
#   tests/diagnose_test.rs             (7,8) insert_spans + insert_spans_full
#   tests/federated_query_test.rs      (7)  check_row, positional assertions
#
# The test helpers are exempt because their arguments ARE the assertion: reading
# `check_row(&rows, "svcA", 3, 60_000, 20_000.0, 10_000, 30_000)` is the point,
# and hiding those numbers behind field names on a single-call-path struct makes
# the test less obvious. Ratchet the number down rather than up, and prefer
# deleting an exception to adding one.
# See: https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/TIGER_STYLE.md
too-many-arguments-threshold = 5

# --- DI enforcement ---
# All env var access must go through typed-env (src/config.rs): define the
# variable there as a typed static, then read it via `.value()`. That keeps the
# set of environment inputs enumerable in one place instead of discoverable only
# by grep, which is the DI rule in AGENTS.md.
#
# The bootstrap path in main.rs is the one legitimate exception and carries a
# scoped `#[allow]` with its reason, because it must write the process
# environment before typed-env performs its first read.
disallowed-methods = [
    "std::env::var",
    "std::env::var_os",
    "std::env::set_var",
    "std::env::remove_var",
]
