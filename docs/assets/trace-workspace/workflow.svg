<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Follow a run from trace explorer to related signals</title>
<desc id="desc">Filter root spans, open a trace, select a span in the tree and timeline, inspect recorded payloads, and follow links to logs or a CPU profile. All panels query Sigiro.</desc>
