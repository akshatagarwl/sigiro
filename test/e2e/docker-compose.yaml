x-telemetrygen: &telemetrygen-base
  image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.146.0
  depends_on:
    collector: { condition: service_started }

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/observe --ignore-existing"

  collector:
    build:
      context: ../..
      dockerfile: collector/Dockerfile
    depends_on:
      minio-setup: { condition: service_completed_successfully }
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: observe
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    command: ["--config", "/etc/otelcol/otelcol.e2e.yaml", "--feature-gates=service.profilesSupport"]
    volumes:
      - ../../collector/otelcol.e2e.yaml:/etc/otelcol/otelcol.e2e.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # --- telemetrygen: checkout service ---
  telemetrygen-checkout-traces:
    <<: *telemetrygen-base
    command:
      - traces
      - --otlp-endpoint=collector:4317
      - --otlp-insecure
      - --service=checkout
      - --traces=50
      - --child-spans=3
      - --rate=10
      - --duration=30s

  telemetrygen-checkout-metrics:
    <<: *telemetrygen-base
    command:
      - metrics
      - --otlp-endpoint=collector:4317
      - --otlp-insecure
      - --service=checkout
      - --metrics=20
      - --rate=5
      - --duration=30s

  telemetrygen-checkout-logs:
    <<: *telemetrygen-base
    command:
      - logs
      - --otlp-endpoint=collector:4317
      - --otlp-insecure
      - --service=checkout
      - --logs=100
      - --rate=20
      - --duration=30s

  # --- telemetrygen: payments service ---
  telemetrygen-payments-traces:
    <<: *telemetrygen-base
    command:
      - traces
      - --otlp-endpoint=collector:4317
      - --otlp-insecure
      - --service=payments
      - --traces=50
      - --child-spans=2
      - --rate=10
      - --duration=30s

  telemetrygen-payments-metrics:
    <<: *telemetrygen-base
    command:
      - metrics
      - --otlp-endpoint=collector:4317
      - --otlp-insecure
      - --service=payments
      - --metrics=20
      - --rate=5
      - --duration=30s

  telemetrygen-payments-logs:
    <<: *telemetrygen-base
    command:
      - logs
      - --otlp-endpoint=collector:4317
      - --otlp-insecure
      - --service=payments
      - --logs=100
      - --rate=20
      - --duration=30s

  # --- query-server: DuckDB-backed investigation API ---
  query-server:
    build:
      context: ../..
      dockerfile: cmd/query-server/Dockerfile
    depends_on:
      collector: { condition: service_started }
    environment:
      S3_ENDPOINT: minio:9000
      S3_BUCKET: observe
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"

  # --- profilegen: synthetic OTLP profiles ---
  profilegen:
    build: ./profilegen
    depends_on:
      collector: { condition: service_started }
    command:
      - --endpoint=collector:4317
      - --insecure
      - --services=checkout,payments
      - --duration=30s
      - --rate=2
