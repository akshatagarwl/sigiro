apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
  namespace: sock-shop
spec:
  selector:
    matchLabels:
      app: obi
  template:
    metadata:
      labels:
        app: obi
    spec:
      serviceAccountName: obi
      hostPID: true
      containers:
        - name: obi
          image: otel/ebpf-instrument:main
          securityContext:
            privileged: true
          env:
            - name: OTEL_EBPF_AUTO_TARGET_EXE
              value: "*"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://sigiro-collector.sigiro.svc:4318
            - name: OTEL_EBPF_KUBE_METADATA_ENABLE
              value: "true"
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: run
              mountPath: /var/run/obi
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: run
          emptyDir: {}
