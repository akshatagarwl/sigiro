dist:
  module: github.com/akshatagarwl/observe/collector/cmd/collector
  name: observe-collector
  description: Observe collector with unified Parquet exporter
  version: 0.1.0
  output_path: ./collector/cmd/collector

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/otelarrowreceiver v0.147.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.147.0
  - gomod: go.opentelemetry.io/ebpf-profiler v0.0.202610
    import: go.opentelemetry.io/ebpf-profiler/collector

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v0.147.0

exporters:
  - gomod: github.com/akshatagarwl/observe v0.0.0
    import: github.com/akshatagarwl/observe/collector/exporter/unified
    path: ./
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.147.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.147.0
