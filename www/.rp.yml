version: 1

verify-cmd: bunx tsc --noEmit --pretty 2>&1 | head -60

tests: []

guidance: |
  This is a React + TypeScript project using @xyflow/react (React Flow) for DAG visualization.
  The plan view is at www/src/plan/ with these files:
  - Plan.tsx: main component with state management and ReactFlow
  - StepNode.tsx: custom node component with expand/collapse, concerns, status
  - layout.ts: dagre-based auto-layout
  - plan.css: BEM-style CSS
  - canvas-types.ts: TypeScript types

  Design tokens are in www/src/index.css (:root vars).
  Fonts: Plus Jakarta Sans (display/body), JetBrains Mono (mono).
  Palette: cream bg (#FEFBF6), warm accents.

  Key issues to look for:
  1. React Flow onNodeClick conflicts with button clicks inside nodes
  2. Buttons/inputs inside React Flow nodes need "nopan nodrag nowheel" classes
  3. stopPropagation alone is not enough in React Flow — need the CSS classes
  4. Status cycling should be a dedicated button, not the whole card click
  5. Card body shows raw markdown — should at least strip # headers into readable text
