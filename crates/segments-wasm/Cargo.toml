[package]
name = "sigiro-segments-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "58", default-features = false }
js-sys = "0.3.91"
serde_json = "1"
sigiro-segments = { path = "../segments" }
wasm-bindgen = "0.2.114"

[lints.clippy]
disallowed-methods = "deny"
disallowed-macros = "deny"
let-underscore-must-use = "deny"
needless-pass-by-value = "warn"
cloned-instead-of-copied = "warn"
redundant-closure-for-method-calls = "warn"
manual-string-new = "warn"
inefficient-to-string = "warn"

[lints.rust]
unused-must-use = "deny"
dead_code = "warn"
unused_imports = "warn"
