[package]
name = "sigiro-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# Must build for both the native binary and wasm32-unknown-unknown, so only
# wasm-safe crates belong here: no tokio, tonic, axum or duckdb.
[dependencies]
drain3 = "0.3.0"
itertools = "0.15.0"
regex = "1"
sha2 = "0.11"
tracing = "0.1"

[lints]
workspace = true
