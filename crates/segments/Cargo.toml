[package]
name = "sigiro-segments"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["with-serde", "gen-tonic-messages"]
with-serde = []
gen-tonic-messages = []

[dependencies]
arrow = { version = "60", default-features = false }
base64 = "0.23"
const-hex = "1.14"
hex = "0.4.3"
nutype = { version = "0.8", features = ["serde"] }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
prost = "0.14"
regex = "1"
sqlparser = { version = "0.63", features = ["visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tracing = "0.1"

[dev-dependencies]
# The profiles tests encode with the same proto revision the ingest path decodes
# (opentelemetry-proto v1.10 layout, also used by the gRPC server).
otlp033 = { package = "opentelemetry-proto", version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "profiles"] }
bytes = "1"
opentelemetry-proto = { version = "0.33", git = "https://github.com/Arnav12114/opentelemetry-rust.git", rev = "7b70ecc68e68a1e0ea5c343caf8e37c68adaa356", default-features = false, features = ["gen-tonic-messages", "logs", "metrics", "trace", "with-serde"] }
tempfile = "3"
