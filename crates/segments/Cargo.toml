[package]
name = "sigiro-segments"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[features]
default = ["with-serde", "gen-tonic-messages"]
with-serde = []
gen-tonic-messages = []

[dependencies]
arrow = { version = "58", default-features = false }
base64 = "0.22"
const-hex = "1.14"
hex = "0.4.3"
nutype = { version = ">=0.7,<0.8", features = ["serde"] }
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
prost = "0.14"
regex = "1"
sqlparser = { version = "0.53", features = ["visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tracing = "0.1"

[dev-dependencies]
bytes = "1"
opentelemetry-proto = { version = "0.33", git = "https://github.com/Arnav12114/opentelemetry-rust.git", rev = "7b70ecc68e68a1e0ea5c343caf8e37c68adaa356", default-features = false, features = ["gen-tonic-messages", "logs", "metrics", "trace", "with-serde"] }
tempfile = "3"
