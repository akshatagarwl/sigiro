# PostgreSQL 18 shared-cluster contract. Included from postgresql.conf.
listen_addresses = '127.0.0.1,::1'
port = 5432
ssl = on
ssl_min_protocol_version = 'TLSv1.3'
ssl_cert_file = '/etc/postgresql/18/main/server.crt'
ssl_key_file = '/etc/postgresql/18/main/server.key'
password_encryption = 'scram-sha-256'
shared_preload_libraries = 'pg_cron'
cron.database_name = 'pipeline'
max_connections = 150
shared_buffers = '256MB'
work_mem = '2MB'
maintenance_work_mem = '128MB'
effective_cache_size = '2GB'

# Application connections use auth-db.sigiro.com with sslmode=verify-full.
# pg_hba.conf rejects every non-TLS TCP connection.
