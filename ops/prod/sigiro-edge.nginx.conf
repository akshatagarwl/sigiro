worker_processes 1;
pid /tmp/nginx.pid;
# systemd connects stderr to the journal socket, so /dev/stderr is not an
# openable device here (nginx fails with "No such device or address").
# `stderr` is nginx's own literal target for the process's stderr stream.
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;

        location = /health {
            return 200;
        }

        location / {
            return 404;
        }
    }
}
