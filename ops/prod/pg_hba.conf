# Local administration remains available for package and migration tooling.
local   all             postgres                                peer
local   all             all                                     peer

# Application TCP is TLS-only. Roles are isolated by database.
hostssl pipeline        linguabench_app  127.0.0.1/32            scram-sha-256
hostssl pipeline        linguabench_app  ::1/128                 scram-sha-256
hostssl sigiro          sigiro           127.0.0.1/32            scram-sha-256
hostssl sigiro          sigiro           ::1/128                 scram-sha-256

# Reject every other TCP connection, including cleartext localhost traffic.
host    all             all              127.0.0.1/32            reject
host    all             all              ::1/128                 reject
