rules:
  # =============================================================================
  # Tiger Style: Error Handling — No Silent Error Drops
  # =============================================================================

  - id: tiger-no-ok-discard
    patterns:
      - pattern: $X.ok()
      # Allow .ok() when chained into .ok_or / .ok_or_else / .filter / ? (error IS handled)
      - pattern-not: $X.ok().filter(...)
      - pattern-not: $X.ok()?
    message: |
      Tiger Style: .ok() silently discards errors. Use .context("...")? to propagate,
      or .ok().filter(...) / .ok()? if this is genuinely an Option conversion.
      If the value is legitimately nullable (e.g., LEFT JOIN NULL), add a comment explaining why.
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - src/
      exclude:
        - src/**/tests/**
        - tests/

  - id: tiger-no-unwrap-or-default
    pattern: $X.unwrap_or_default()
    message: |
      Tiger Style: .unwrap_or_default() masks errors with zero values. An agent could
      see 0% error rate when the DB query actually failed. Use .context("field_name")?
      to propagate, or document WHY a default is safe with a TRADEOFF comment.
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - src/
      exclude:
        - src/**/tests/**
        - tests/

  - id: tiger-no-bare-unwrap
    pattern: $X.unwrap()
    message: |
      Tiger Style: .unwrap() panics on error — use .context("why")? or .expect("invariant: ...")
      for truly infallible operations. In tests, .unwrap() is acceptable.
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - src/
      exclude:
        - src/**/tests/**
        - tests/

  - id: tiger-no-let-underscore-discard
    pattern: let _ = $X;
    message: |
      Tiger Style: `let _ = ...` silently discards a value or error. Handle the Result
      explicitly with ? or match. If intentional, use `let _name = ...` with a descriptive
      name and a comment explaining WHY the value is discarded.
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - src/
      exclude:
        - src/**/tests/**
        - tests/

  # =============================================================================
  # Tiger Style: Logging — Use tracing, Not println/eprintln
  # =============================================================================

  - id: tiger-no-println
    pattern: println!(...)
    message: |
      Tiger Style: Use tracing::info!() instead of println!() in library/server code.
      println!() is only acceptable in CLI command handlers for direct user output.
    languages: [rust]
    severity: INFO
    paths:
      include:
        - src/
      exclude:
        - src/main.rs  # CLI output is acceptable
        - tests/

  - id: tiger-no-eprintln
    pattern: eprintln!(...)
    message: |
      Tiger Style: Use tracing::error!() or tracing::warn!() instead of eprintln!().
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - src/
      exclude:
        - tests/

  # =============================================================================
  # Tiger Style: Assertions — Production Assertions Over debug_assert
  # =============================================================================

  - id: tiger-no-debug-assert
    pattern: debug_assert!($X)
    message: |
      Tiger Style: Use assert!() instead of debug_assert!(). Assertions are safety
      mechanisms and must remain in production builds. "Assertions are self-verifying
      documentation" — they should never be compiled out.
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - src/

  - id: tiger-no-debug-assert-eq
    pattern: debug_assert_eq!($X, $Y)
    message: |
      Tiger Style: Use assert_eq!() instead of debug_assert_eq!(). Keep assertions in production.
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - src/
