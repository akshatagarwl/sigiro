# Cross-compilation fixes for macOS -> aarch64-unknown-linux-gnu via cargo-zigbuild.
#
# zig 0.16.0's built-in ar is broken (can't create archives).
# Homebrew's llvm-ar works as a drop-in replacement.
#
# NOTE: cargo's [target.<triple>.ar] only affects Rust's linker, NOT cc-rs build scripts.
# The env vars below are what cc-rs (ring, zstd-sys, libsqlite3-sys, libduckdb-sys) actually reads.
# Set them before cross-compiling:
#   export AR_aarch64_unknown_linux_gnu=/opt/homebrew/opt/llvm/bin/llvm-ar
#   ulimit -n 65536
#   cargo zigbuild --release --target aarch64-unknown-linux-gnu

[target.aarch64-unknown-linux-gnu]
linker = "~/Library/Caches/cargo-zigbuild/0.22.1/zigcc-aarch64-unknown-linux-gnu-6e31.sh"
