[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

# sigiro-core runs in Workers; getrandom must use the JS backend there.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# Route native dependency compilers through sccache. DuckDB is supplied by the
# repository's pinned prebuilt static archive and does not use these compilers.
[env]
CC = "sccache cc"
CXX = "sccache c++"
