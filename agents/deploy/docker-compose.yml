name: sigiro

services:
  sigiro:
    image: ghcr.io/sigiroai/sigiro@sha256:d10159589c6597304b13f49ad0a2e772b214c30cf239ad4f0f42f19c4370682c
    ports:
      - "127.0.0.1:${SIGIRO_PORT:-19999}:9999"
      - "127.0.0.1:${SIGIRO_OTLP_PORT:-14318}:4318"
    volumes:
      - sigiro-data:/var/lib/sigiro
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/health/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    environment:
      SIGIRO_REPOSITORY: ${SIGIRO_REPOSITORY:?set SIGIRO_REPOSITORY to OWNER/REPO}
      EVE_SANDBOX_IMAGE: ${EVE_SANDBOX_IMAGE:?set EVE_SANDBOX_IMAGE to a locally available project image}
      SIGIRO_AGENT_PROVIDER: claude
      OTEL_EXPORTER_OTLP_ENDPOINT: http://sigiro:4318
      CELLD_BUCKET: sigiro-agent
      S3_ENDPOINT: http://rustfs:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    volumes:
      - agent-data:/var/lib/sigiro-agent
      # Only the trusted agent host controls Docker. Repository sandboxes receive no socket or credentials.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${COORDINATOR_PORT:-18080}:8080"
      - "127.0.0.1:${EVE_PORT:-12000}:12000"
    depends_on:
      rustfs:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/deploy/start-agent.sh, health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 110s

volumes:
  sigiro-data:
  rustfs-data:
  agent-data:
