name: sigiro

services:
  sigiro:
    image: ghcr.io/sigiroai/sigiro@sha256:d10159589c6597304b13f49ad0a2e772b214c30cf239ad4f0f42f19c4370682c
    ports:
      - "127.0.0.1:${SIGIRO_PORT:-19999}:9999"
      - "127.0.0.1:${SIGIRO_OTLP_PORT:-14318}:4318"
    volumes:
      - sigiro-data:/var/lib/sigiro
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    environment:
      SIGIRO_REPOSITORY: ${SIGIRO_REPOSITORY:?set SIGIRO_REPOSITORY to OWNER/REPO}
      BOX_API_KEY: ${BOX_API_KEY:?set BOX_API_KEY in .env}
      SIGIRO_AGENT_PROVIDER: claude
      OTEL_EXPORTER_OTLP_ENDPOINT: http://sigiro:4318
      CELLD_BUCKET: ${CELLD_BUCKET:?set CELLD_BUCKET to an S3 bucket with conditional-write support}
      # Empty for Amazon S3. Set for an S3-compatible store such as R2.
      S3_ENDPOINT: ${S3_ENDPOINT-}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION to the bucket's region, or auto for R2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    volumes:
      - agent-data:/var/lib/sigiro-agent
    ports:
      - "127.0.0.1:${CELLD_PORT:-18080}:8080"
      - "127.0.0.1:${EVE_PORT:-12000}:12000"
    healthcheck:
      test: [CMD, /app/deploy/start-agent.sh, health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 110s

volumes:
  sigiro-data:
  agent-data:
