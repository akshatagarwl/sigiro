name: sigiro

services:
  sigiro:
    image: ghcr.io/sigiroai/sigiro@sha256:d10159589c6597304b13f49ad0a2e772b214c30cf239ad4f0f42f19c4370682c
    ports:
      - "127.0.0.1:${SIGIRO_PORT:-19999}:9999"
      - "127.0.0.1:${SIGIRO_OTLP_PORT:-14318}:4318"
    volumes:
      - sigiro-data:/var/lib/sigiro
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    environment:
      SIGIRO_REPOSITORY: ${SIGIRO_REPOSITORY:?set SIGIRO_REPOSITORY to OWNER/REPO}
      EVE_SANDBOX_IMAGE: ${EVE_SANDBOX_IMAGE:?set EVE_SANDBOX_IMAGE to a locally available project image}
      SIGIRO_AGENT_PROVIDER: ${SIGIRO_AGENT_PROVIDER:-claude}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://sigiro:4318
      CELLD_BUCKET: sigiro-agent
      S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - agent-data:/var/lib/sigiro-agent
      # Only the trusted agent host controls Docker. Repository sandboxes receive no socket or credentials.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${COORDINATOR_PORT:-18080}:8080"
      - "127.0.0.1:${EVE_PORT:-12000}:12000"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/deploy/start-agent.sh, health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 110s

volumes:
  sigiro-data:
  minio-data:
  agent-data:
