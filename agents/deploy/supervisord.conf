[unix_http_server]
file=/tmp/sigiro-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/sigiro-supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/sigiro-supervisor.sock

[program:celld]
environment=CELLD_OTEL="1",CELLD_OTEL_SINK="otlp",CELLD_OTEL_FLUSH_MS="1000",OTEL_SERVICE_NAME="sigiro-coordinator"
command=/usr/local/bin/celld --bucket %(ENV_CELLD_BUCKET)s --endpoint %(ENV_S3_ENDPOINT)s --region %(ENV_AWS_REGION)s --listen 0.0.0.0:8080 --internal-listen 127.0.0.1:8081
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=45
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:eve]
command=bun /app/.output/server/index.mjs
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=bun /app/dist/executor/main.js
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
