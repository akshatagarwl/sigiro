receivers:
  # Primary: OTel Arrow — 30-70% bandwidth savings over standard OTLP.
  # Accepts both Arrow-encoded and standard OTLP protobuf over gRPC.
  # Does NOT support profiles signal or HTTP protocol.
  otelarrow:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

  # Fallback: standard OTLP receiver for:
  # - Profiles signal (otelarrow doesn't support profiles yet)
  # - HTTP clients (browsers, PHP/Python SDKs, firewalled environments)
  # When otelarrow adds profiles support, this becomes HTTP-only fallback.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
      http:
        endpoint: 0.0.0.0:4318

  # Pyroscope SDK ingest: accepts Pyroscope native /ingest push protocol.
  pyroscope:
    http:
      endpoint: 0.0.0.0:4040
    timeout: 10s

processors:
  batch:
    timeout: 5s

extensions:
  file_storage/queue:
    directory: /var/lib/observe/queue
    create_directory: true
    compaction:
      on_rebound: true

exporters:
  unified_parquet:
    s3_bucket: ${env:S3_BUCKET}
    s3_region: ${env:S3_REGION:-us-east-1}
    s3_endpoint: ${env:S3_ENDPOINT}
    s3_access_key: ${env:S3_ACCESS_KEY}
    s3_secret_key: ${env:S3_SECRET_KEY}
    sending_queue:
      storage: file_storage/queue
  debug:
    verbosity: basic

service:
  extensions: [file_storage/queue]
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otelarrow, otlp]
      processors: [batch]
      exporters: [unified_parquet, debug]
    traces:
      receivers: [otelarrow, otlp]
      processors: [batch]
      exporters: [unified_parquet, debug]
    logs:
      receivers: [otelarrow, otlp]
      processors: [batch]
      exporters: [unified_parquet, debug]
    profiles:
      receivers: [otlp, pyroscope]
      # batch processor does not support profiles signal yet
      exporters: [unified_parquet, debug]
