receivers:
  otelarrow:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
      http:
        endpoint: 0.0.0.0:4318

  profiling:
    samples_per_second: 20
    tracers: all
    reporter_interval: 5s

processors:
  batch:
    timeout: 5s

  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.namespace.name
        - k8s.node.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.container.name
        - container.id
        - container.image.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection

extensions:
  file_storage/queue:
    directory: /var/lib/observe/queue
    create_directory: true
    compaction:
      on_rebound: true

exporters:
  unified_parquet:
    s3_bucket: ${env:S3_BUCKET}
    s3_region: ${env:S3_REGION:-us-east-1}
    s3_endpoint: ${env:S3_ENDPOINT}
    s3_access_key: ${env:S3_ACCESS_KEY}
    s3_secret_key: ${env:S3_SECRET_KEY}
    sending_queue:
      storage: file_storage/queue
  debug:
    verbosity: basic

service:
  extensions: [file_storage/queue]
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otelarrow, otlp]
      processors: [k8sattributes, batch]
      exporters: [unified_parquet, debug]
    traces:
      receivers: [otelarrow, otlp]
      processors: [k8sattributes, batch]
      exporters: [unified_parquet, debug]
    logs:
      receivers: [otelarrow, otlp]
      processors: [k8sattributes, batch]
      exporters: [unified_parquet, debug]
    profiles:
      receivers: [otlp, profiling]
      processors: [k8sattributes]
      exporters: [unified_parquet, debug]
