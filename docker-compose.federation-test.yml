# Lightweight federation test using pre-built image
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: sigiro
      POSTGRES_PASSWORD: sigiro
    volumes:
      - pg-fed-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigiro -d ducklake"]
      interval: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-fed-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 10

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/sigiro-cold;
      mc policy set public local/sigiro-cold;
      "

  worker-1:
    image: sigiro:local
    environment:
      - SIGIRO_DATA_DIR=/data/worker-1
      - SIGIRO_API_KEY=sigiro_dev_fed
      - SIGIRO_HTTP_PORT=9999
      - SIGIRO_GRPC_PORT=4317
      - SIGIRO_OTLP_HTTP_PORT=4318
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://central:9999
    ports:
      - "10001:9999"
      - "10101:4317"
      - "10102:4318"
    volumes:
      - worker-1-data:/data/worker-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9999/health"]
      interval: 5s
      retries: 10

  worker-2:
    image: sigiro:local
    environment:
      - SIGIRO_DATA_DIR=/data/worker-2
      - SIGIRO_API_KEY=sigiro_dev_fed
      - SIGIRO_HTTP_PORT=9999
      - SIGIRO_GRPC_PORT=4317
      - SIGIRO_OTLP_HTTP_PORT=4318
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://central:9999
    ports:
      - "10002:9999"
      - "10201:4317"
      - "10202:4318"
    volumes:
      - worker-2-data:/data/worker-2
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9999/health"]
      interval: 5s
      retries: 10
  central:
    image: sigiro:local
    environment:
      - SIGIRO_DATA_DIR=/data/central
      - SIGIRO_API_KEY=sigiro_dev_fed
      - SIGIRO_HTTP_PORT=9999
      - SIGIRO_GRPC_PORT=4317
      - SIGIRO_OTLP_HTTP_PORT=4318
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://central:9999
      - SIGIRO_CATALOG_URL=postgresql://sigiro:sigiro@postgres:5432/ducklake
      - SIGIRO_S3_BUCKET=sigiro-cold
      - SIGIRO_S3_REGION=us-east-1
      - SIGIRO_S3_PREFIX=central
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL_S3=http://minio:9000
      - AWS_S3_ALLOW_UNSAFE_RENAME=true
    ports:
      - "10000:9999"
      - "10003:4317"
      - "10004:4318"
    volumes:
      - central-data:/data/central
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
    command: >
      sh -c "
        sigiro serve &
        sleep 15
        curl -sf -X POST http://localhost:9999/v1/federation/workers \
          -H 'Content-Type: application/json' \
          -H 'Authorization: Bearer sigiro_dev_fed' \
          -d '{\"id\":\"worker-1\",\"endpoint\":\"http://worker-1:9999\",\"catalog_path\":\"/data/worker-1/default/catalog.sqlite\",\"mode\":\"otlp\",\"platform\":{\"os\":\"linux\",\"kernel\":\"6.1\",\"arch\":\"x86_64\",\"container\":\"docker\"},\"ebpf_status\":\"not_applicable\",\"capabilities\":{\"bpf\":false,\"net_admin\":false}}'
        curl -sf -X POST http://localhost:9999/v1/federation/workers \
          -H 'Content-Type: application/json' \
          -H 'Authorization: Bearer sigiro_dev_fed' \
          -d '{\"id\":\"worker-2\",\"endpoint\":\"http://worker-2:9999\",\"catalog_path\":\"/data/worker-2/default/catalog.sqlite\",\"mode\":\"otlp\",\"platform\":{\"os\":\"linux\",\"kernel\":\"6.1\",\"arch\":\"x86_64\",\"container\":\"docker\"},\"ebpf_status\":\"not_applicable\",\"capabilities\":{\"bpf\":false,\"net_admin\":false}}'
        echo 'Workers registered'
        wait
      "
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9999/health"]
      interval: 5s
      retries: 15

volumes:
  pg-fed-data:
  minio-fed-data:
  worker-1-data:
  worker-2-data:
  central-data:

networks:
  default:
    name: sigiro-federation
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
