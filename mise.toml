[tools]
sccache = "0.17.0"
# The packslip backend verifies the vendor's Sigstore identity and artifact
# digest before installing either tool. Keep exact versions so signer or
# artifact changes arrive as reviewable mise.lock diffs.
"packslip:github.com/jdx/hk" = "1.58.1"
"packslip:github.com/jdx/mr-boxington" = "1.12.0"
# 2.2.17 is intentionally not selected yet: it is inside mise's 24-hour
# minimum-release-age window. Do not weaken that supply-chain policy globally.
"packslip:github.com/aubepkg/aube" = "2.2.16"
# Stable, matching the Dockerfile's pinned Rust 1.98.1 image. Nothing here needs
# nightly: no `#![feature]`, no `cargo-features`, no `[unstable]`, no `-Z`, and
# edition 2024 is stable. The previous `nightly-2026-09-05` pin existed only to
# carry `rustc-codegen-cranelift-preview`, which macOS cannot actually use
# because Cranelift there does not preserve the `catch_unwind` behavior
# `src/anomaly.rs` and `src/quack.rs` rely on. Keeping it cost two compiler
# identities in mbx's cache, so an unactivated task (stable) and an activated
# task (nightly) shared nothing and each paid a cold
# build. The content-addressed gates below also include the resolved compiler
# and mbx identities, so every invocation uses the same cache namespace.
rust = { version = "1.98.1", components = ["rustfmt", "clippy"], targets = ["aarch64-unknown-linux-gnu"] }

# DuckDB v2 is not published through DuckDB's stable release channel yet.
# Install its exact upstream staging CLI through mise's built-in HTTP backend.
[tools."http:duckdb"]
version = "v2.0.0-alpha41489"

[tools."http:duckdb".platforms]
linux-x64 = { url = "https://duckdb-staging.duckdb.org/10de957379/v2.0.0-alpha41489/duckdb/duckdb/github_release/duckdb-cli-linux-amd64.tar.gz", checksum = "sha256:57215243cde3a00b3f64f7bceb4f3a972b4f45f0770a8418b7977a65abba9290" }
linux-arm64 = { url = "https://duckdb-staging.duckdb.org/10de957379/v2.0.0-alpha41489/duckdb/duckdb/github_release/duckdb-cli-linux-arm64.tar.gz", checksum = "sha256:e92f0ec283c983ec9b36f5abadeb03127b32ce360e2c3051fef9b1bdf331af9c" }
macos-x64 = { url = "https://duckdb-staging.duckdb.org/10de957379/v2.0.0-alpha41489/duckdb/duckdb/github_release/duckdb-cli-osx-amd64.tar.gz", checksum = "sha256:63d90c09c58f5ad788341859c18d62e6ba2d9fecf3c3035cbadde56257ed055a" }
macos-arm64 = { url = "https://duckdb-staging.duckdb.org/10de957379/v2.0.0-alpha41489/duckdb/duckdb/github_release/duckdb-cli-osx-arm64.tar.gz", checksum = "sha256:d71af9d28992a03f811792a56e2bb9b8776f3820455aa0006cedc2eda254d8f5" }

# Keep Cargo as Rust's package/build engine, but route every repository-local
# `cargo …` invocation through mbx so no command silently bypasses the shared
# compiler cache.
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[settings]
lockfile = true
experimental = true

[task_config.input_groups]
rust-gate = [
    "src/**",
    "tests/*.rs",
    "tests/snapshots/**",
    "benches/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain*",
    ".cargo/**",
    "clippy.toml",
    "scripts/**",
    "mise.lock",
    ".env",
]
# The deployment contract is not Rust, so `rust-gate` (src/**, tests/*.rs)
# never sees it. Without this group a change to the migration script or a
# deployment test would hit a stale cache and the gate would report success
# without running them.
deployment-contract = [
    "tests/deployment/**",
    "ops/prod/**",
]

[env]
# Keep C/C++ tools available for native dependencies; DuckDB itself is always
# supplied by scripts/prepare-duckdb-static.sh and never compiled here.
CC = "sccache {% if os() == 'macos' %}clang{% else %}cc{% endif %}"
CXX = "sccache {% if os() == 'macos' %}clang++{% else %}c++{% endif %}"
# Was `set dotenv-load` in the justfile. Optional: `.env` is gitignored and a
# clone does not have one, and a missing file must not fail every task.
_.file = { path = ".env", optional = true }

[tasks.default]
description = "List the tasks in this repo."
run = "mise tasks ls"

[tasks.www-install]
description = "Install website dependencies from the frozen aube lockfile."
run = "aube -C www install --frozen-lockfile"

[tasks.auth-install]
description = "Install auth dependencies from the frozen aube lockfile."
run = "aube -C auth install --frozen-lockfile"

[tasks.auth-check]
description = "Typecheck and run the auth UI test."
run = "aube -C auth run check"

[tasks.auth-test]
description = "Run the auth test suite."
run = "aube -C auth run test"

[tasks.auth-lint]
description = "Lint the auth package with type-aware checks."
run = "aube -C auth run lint"

[tasks.auth-build]
description = "Build the auth package."
run = "aube -C auth run build"

[tasks.auth-audit]
description = "Audit production auth dependencies."
run = "aube -C auth audit --prod"

[tasks.auth-image]
description = "Build the auth image locally without publishing."
run = "docker buildx bake sigiro-auth --load"

[tasks.alchemy-plan]
description = "Plan the production Cloudflare stack without applying changes."
run = "aube -C www run alchemy:plan"

[tasks.alchemy-deploy]
description = "Deploy the production Cloudflare stack through Alchemy."
run = "aube -C www run alchemy:deploy"

[tasks.alchemy-hetzner-plan]
description = "Plan the adopted production Hetzner stack without applying changes."
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ -z "${HCLOUD_TOKEN:-}" ]]; then
  export HCLOUD_TOKEN="$(hcloud config get token --allow-sensitive)"
fi
if [[ -z "$HCLOUD_TOKEN" ]]; then
  echo "alchemy-hetzner-plan: HCLOUD_TOKEN is unavailable and the active hcloud context has no token" >&2
  exit 1
fi
aube -C www run alchemy:hetzner:plan
"""

[tasks.alchemy-workload-plan]
description = "Plan the native systemd workload through Alchemy."
run = "aube -C www run alchemy:workload:plan"

[tasks.alchemy-workload-deploy]
description = "Deploy the native systemd workload through Alchemy."
run = "aube -C www run alchemy:workload:deploy"

[tasks.native-host-check]
description = "Validate the adopted-host systemd contract without connecting to production."
run = "ops/prod/deploy-native-host.sh --check"

[tasks.native-artifact]
description = "Package a deterministic x86_64 native artifact."
run = "scripts/package-native-artifact.py --input ${NATIVE_ARTIFACT_INPUT:?set NATIVE_ARTIFACT_INPUT} --service ${NATIVE_ARTIFACT_SERVICE:?set NATIVE_ARTIFACT_SERVICE} --version ${NATIVE_ARTIFACT_VERSION:-0.1.0} --output ${NATIVE_ARTIFACT_DIR:-dist-bin/native}"

[tasks.native-contract-test]
description = "Run black-box native deployment invariant tests."
# Both suites, not just the contract one. The sync-postgres boundary test was
# not wired into any gate, so the drop bug that aborted production on every
# boot could not have been caught by CI.
run = "python3 -m unittest tests.deployment.test_native_contract tests.deployment.test_sync_postgres_boundary"

[tasks.native-backup]
description = "Create and structurally verify encrypted off-host pre-cutover backups."
run = "scripts/backup-native-host.sh"

[tasks.native-stage]
description = "Stage native packages, artifacts, units, and PostgreSQL 18 without stopping Docker workloads."
run = "SIGIRO_NATIVE_ACTION=stage aube -C www run alchemy:workload:deploy"


[tasks.native-cutover]
description = "Perform the backup-gated host-wide systemd cutover."
run = "SIGIRO_NATIVE_ACTION=cutover aube -C www run alchemy:workload:deploy"

[tasks.native-verify]
description = "Verify all native services and assert that no Docker workload is running."
run = "SIGIRO_NATIVE_ACTION=verify aube -C www run alchemy:workload:deploy"

[tasks.build]
description = "Release build of the sigiro binary. Set TARGET to cross-compile."
run = 'scripts/run-with-duckdb-static.sh mbx build --release --locked --bin sigiro ${TARGET:+--target "$TARGET"}'

[tasks.build-dev]
description = "Build a debug binary with Apple ld on macOS or pinned jdxld on Linux."
run = """
case "$(uname -s)" in
  Darwin) TMPDIR=/tmp scripts/run-with-duckdb-static.sh mbx build --bin sigiro ;;
  Linux) mise run _build-dev-jdxld ;;
  *) echo "build-dev: unsupported host $(uname -s); expected macOS or Linux" >&2; exit 1 ;;
esac
"""

[tasks._build-dev-jdxld]
hide = true
# jdxld has no published Linux release yet. Build the reviewed Git commit
# instead of following its moving main branch; mise installs this only when the
# Linux branch of build-dev invokes this task.
tools = { "cargo:https://github.com/jdx/jdxld" = "rev:8ef70b88c7f25da631aa2364076947752ecfa26d" }
run = """
if [ "$(uname -s)" != Linux ]; then
  echo "_build-dev-jdxld: jdxld dev linking is Linux-only" >&2
  exit 1
fi
if ! command -v clang >/dev/null; then
  echo "_build-dev-jdxld: clang is required to drive jdxld" >&2
  exit 1
fi
TMPDIR=/tmp RUSTFLAGS="-Clinker=clang -Clink-arg=--ld-path=jdxld" scripts/run-with-duckdb-static.sh mbx build --bin sigiro
if ! strings target/debug/sigiro | grep -q "Linker: jdxld"; then
  echo "_build-dev-jdxld: binary does not contain jdxld's linker marker" >&2
  exit 1
fi
"""

# Quick compile-only feedback; the authoritative gate below owns tests.
[tasks.quick]
description = "Fast formatting, dependency, and compile checks."
run = """
#!/usr/bin/env bash
set -euo pipefail
eval "$(scripts/prepare-duckdb-static.sh "$(rustc -vV | sed -n 's/^host: //p')")"
mbx fmt --check
mbx check --all-targets --all-features
"""
sources = ["@group:rust-gate"]
outputs = []
cache = { enabled = true, env = ["CI", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "RUSTC_WRAPPER", "CC", "CXX", "DUCKDB_LIB_DIR", "DUCKDB_INCLUDE_DIR", "DUCKDB_STATIC"], command_inputs = ["mbx --version", "rustc --version --verbose"] }

[tasks.verify-prebuilt-duckdb]
description = "Verify DuckDB archive reuse and a build without C++ compilation."
run = "scripts/verify-prebuilt-duckdb.sh"

# Fast inner-loop gate. The two maintenance tests deliberately wait on real
# clocks (about 20s together), and the full integration suite starts many real
# DuckDB instances. CI owns those checks through `full`; local edits keep one
# representative ingest-to-diagnose E2E plus the rest of the library suite.
[tasks.gate]
description = "Fast development gate, cached by content."
run = [
    { task = "quick" },
    "SIGIRO_SHUTDOWN_TIMEOUT_SECS=60 scripts/run-with-duckdb-static.sh mbx test --lib -- --skip inserter::tests::real_checkpoint_failure_trips_and_recovers_the_shed_gate --skip inserter::tests::retention_covers_projects_evicted_from_the_pool",
    "SIGIRO_SHUTDOWN_TIMEOUT_SECS=60 scripts/run-with-duckdb-static.sh mbx test --test e2e_test",
]
sources = ["@group:rust-gate"]
outputs = []
cache = { enabled = true, audit = true, env = ["CI", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "RUSTC_WRAPPER", "CC", "CXX", "DUCKDB_LIB_DIR", "DUCKDB_INCLUDE_DIR", "DUCKDB_STATIC"], command_inputs = ["mbx --version", "rustc --version --verbose"] }

# Full deterministic merge gate. Keep this out of the edit-test loop: the
# complete integration topology and the real-clock maintenance tests dominate
# local wall time, while CI still fails closed on all of them.
[tasks.full]
description = "Full CI gate, cached by content."
run = [
    { task = "quick" },
    "scripts/run-with-duckdb-static.sh mbx clippy --all-targets --all-features -- -D warnings",
    "SIGIRO_SHUTDOWN_TIMEOUT_SECS=60 scripts/run-with-duckdb-static.sh mbx test",
    # The deployment invariants guard production boot: the sync-postgres
    # boundary and the migration contract that must not empty Sigiro's
    # databases. They were outside every gate, so a cutover could ship a
    # process-aborting drop and a destructive migration with CI green.
    { task = "native-contract-test" },
]
sources = ["@group:rust-gate", "@group:deployment-contract"]
outputs = []
cache = { enabled = true, audit = true, env = ["CI", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "RUSTC_WRAPPER", "CC", "CXX", "DUCKDB_LIB_DIR", "DUCKDB_INCLUDE_DIR", "DUCKDB_STATIC"], command_inputs = ["mbx --version", "rustc --version --verbose"] }

[tasks.release]
description = "Authoritative release-mode tests, cached separately."
run = [
    { task = "full" },
    "SIGIRO_SHUTDOWN_TIMEOUT_SECS=60 scripts/run-with-duckdb-static.sh mbx test --release",
]
sources = ["@group:rust-gate"]
outputs = []
cache = { enabled = true, audit = true, env = ["CI", "TARGET", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "RUSTC_WRAPPER", "CC", "CXX", "DUCKDB_LIB_DIR", "DUCKDB_INCLUDE_DIR", "DUCKDB_STATIC"], command_inputs = ["mbx --version", "rustc --version --verbose"] }

[tasks.install-hooks]
description = "Install hk's Git 2.54+ repository-local config hooks."
run = """
#!/usr/bin/env bash
set -euo pipefail
git_bin="$(command -v git)"
PATH="$(dirname "$git_bin"):$PATH" hk uninstall >/dev/null 2>&1 || true
if "$git_bin" config --local --get core.hooksPath >/dev/null; then
  "$git_bin" config --local --unset-all core.hooksPath
fi
version="$($git_bin version)"
version="${version#git version }"
major="${version%%.*}"
remainder="${version#*.}"
minor="${remainder%%.*}"
if (( major < 2 || (major == 2 && minor < 54) )); then
  echo "install-hooks: Git 2.54+ is required; refusing hk legacy script shims" >&2
  exit 1
fi
PATH="$(dirname "$git_bin"):$PATH" hk install --mise
"""

[tasks.run]
description = "Run sigiro locally with dev dependencies (Postgres, RustFS)."
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose -f docker-compose.dev.yml up -d
trap 'docker compose -f docker-compose.dev.yml down' EXIT
scripts/run-with-duckdb-static.sh mbx run --release --bin sigiro
"""

[tasks.check-s3-e2e]
description = 'S3-backed distributed "default" project quack E2E (needs Docker: Postgres + RustFS).'
run = """
#!/usr/bin/env bash
set -euo pipefail
# --wait only on postgres/rustfs (they have healthchecks); rustfs-setup is a
# one-shot job that exits 0 once it creates the bucket, which --wait treats
# as "not running" and fails on if targeted directly. Run it separately,
# attached, so this task blocks until the bucket actually exists.
docker compose -f docker-compose.dev.yml up -d --wait postgres rustfs
docker compose -f docker-compose.dev.yml up rustfs-setup
trap 'docker compose -f docker-compose.dev.yml down -v' EXIT
scripts/run-with-duckdb-static.sh mbx test --test quack_s3_query_surface_test -- --ignored --nocapture
"""

# Storage-mode matrix E2E: proves ingest->flush->query->restart-persistence in
# all three modes (local file / PG+local data / PG+S3). Needs Docker (Postgres +
# RustFS), like check-s3-e2e.
[tasks.check-storage-matrix-e2e]
description = "Storage-mode matrix E2E (local file / PG+local / PG+S3). Needs Docker."
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose -f docker-compose.dev.yml up -d --wait postgres rustfs
docker compose -f docker-compose.dev.yml up rustfs-setup
trap 'docker compose -f docker-compose.dev.yml down -v' EXIT
scripts/run-with-duckdb-static.sh mbx test --test storage_mode_matrix_test -- --ignored --nocapture
"""

# A permanent DuckLake attach failure (data_path / storage-backend mismatch)
# must fail fast, not wedge the pool in its 30x retry loop. Needs Docker Postgres.
[tasks.check-attach-fail-fast-e2e]
description = "A permanent DuckLake attach failure must fail fast, not wedge the pool."
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose -f docker-compose.dev.yml up -d --wait postgres
trap 'docker compose -f docker-compose.dev.yml down -v' EXIT
scripts/run-with-duckdb-static.sh mbx test --test attach_fail_fast_test -- --ignored --nocapture
"""

[tasks.check-hosted-jwt-e2e]
description = "Hosted JWT auth, scopes, OTLP, and tenant-isolation E2E."
run = "scripts/run-with-duckdb-static.sh mbx test --test hosted_jwt_e2e_test -- --ignored --nocapture"

[tasks.image]
description = "Build multi-arch Docker image. Pass --push, or --set flags for cache config."
run = "docker buildx bake sigiro"

# Fast LOCAL image build: native arch only (no amd64 QEMU emulation), no remote
# cache, loaded into docker so you can run it. Use this while iterating; use
# `mise run image -- --push` for the real multi-arch publish. Assumes an arm64 host.
[tasks.image-dev]
description = "Fast local native-arch image build, loaded into docker."
run = """
docker buildx bake sigiro \
  --set "*.platform=linux/arm64" \
  --set "*.cache-to=" \
  --set "*.cache-from=" \
  --load
"""

[tasks.lima-build]
description = "Cross-compile sigiro for Linux ARM64 Lima VMs."
run = """
#!/usr/bin/env bash
set -euo pipefail
source scripts/lima-cross-env.sh
ulimit -n 65536 2>/dev/null || true
eval "$(scripts/prepare-duckdb-static.sh "$SIGIRO_LIMA_TARGET")"
mbx build --release --target "$SIGIRO_LIMA_TARGET" --bin sigiro
file "$SIGIRO_LIMA_SIGIRO_BIN"
"""

[tasks.clean]
description = "Drop the managed target dir and the dev compose stack."
# `mbx clean`, not `cargo clean`: target/ is a link into mbx's shared cache,
# so `cargo clean` deletes the link and the next build restores from cache.
run = [
    "mbx clean",
    "docker compose -f docker-compose.dev.yml down -v --remove-orphans",
]

# Refresh www/openapi.json — the snapshot the API reference is generated from.
# Boots the binary, reads its own /openapi.json, and drops the /admin paths: key
# minting and tenant creation are deliberately not part of the published surface.
# Run this whenever a #[utoipa::path] changes, then `cd www && bun run api:docs`.
[tasks.api-spec]
description = "Refresh www/openapi.json from the binary's own /openapi.json."
run = """
#!/usr/bin/env bash
set -euo pipefail
scripts/run-with-duckdb-static.sh mbx build --quiet --bin sigiro
# A warm data dir under target/: with a fresh one DuckDB re-downloads its
# extensions on every run and the wait below times out.
dir=target/spec-db
mkdir -p "$dir"
SIGIRO_DATA_DIR="$dir" ./target/debug/sigiro serve >/dev/null 2>&1 &
trap 'kill %1 2>/dev/null || true' EXIT
for _ in $(seq 1 60); do
  curl -sf http://localhost:9999/openapi.json -o "$dir/spec.json" && break
  sleep 2
done
test -s "$dir/spec.json" || { echo "sigiro never served /openapi.json" >&2; exit 1; }
python3 -c "
import json
spec = json.load(open('$dir/spec.json'))
spec['paths'] = {p: v for p, v in spec['paths'].items() if not p.startswith('/admin')}
json.dump(spec, open('www/openapi.json', 'w'), indent=2)
print('wrote www/openapi.json -', len(spec['paths']), 'paths')
"
"""
