[tools]
# The packslip backend verifies the vendor's Sigstore identity and artifact
# digest before installing either tool. Keep exact versions so signer or
# artifact changes arrive as reviewable mise.lock diffs.
"packslip:github.com/jdx/hk" = "2.9.0"
# Releases from 2.2.17 on are signed by aube's release.yml instead of
# release-plz.yml (same repository and maintainer), so the packslip signer pin
# was reset once with `mise packslip forget github.com/aubepkg/aube`.
"packslip:github.com/aubepkg/aube" = "2.8.4"
# Rust is not a mise tool: sigiro is built with Nix (`nix build`, `nix
# develop`; see CONTRIBUTING.md), and the toolchain is pinned in
# rust-toolchain.toml.

[settings]
lockfile = true
experimental = true

[env]
# Was `set dotenv-load` in the justfile. Optional: `.env` is gitignored and a
# clone does not have one, and a missing file must not fail every task.
_.file = { path = ".env", optional = true }

[tasks.default]
description = "List the tasks in this repo."
run = "mise tasks ls"

[tasks.www-install]
description = "Install website dependencies from the frozen aube lockfile."
run = "aube -C www install --frozen-lockfile"

[tasks.dashboard-install]
description = "Install dashboard (sigiro.com/dashboard) dependencies from the frozen aube lockfile."
run = "aube -C dashboard install --frozen-lockfile"

[tasks.dashboard-build]
description = "Build the dashboard's static export into dashboard/dist/dashboard."
depends = ["dashboard-install"]
run = "aube -C dashboard run build"

[tasks.docs-build]
description = "Build the docs' static export (sigiro.com/docs, offline) into www/dist-binary, and the docs MCP snapshot into www/dist-mcp."
depends = ["www-install"]
run = "scripts/build-docs-export.sh"

[tasks.auth-install]
description = "Install auth dependencies from the frozen aube lockfile."
run = "aube -C auth install --frozen-lockfile"

[tasks.auth-check]
description = "Typecheck and run the auth UI test."
run = "aube -C auth run check"

[tasks.auth-test]
description = "Run the agent-auth E2E against a local auth Worker on a fresh D1."
run = "aube -C auth run test:agent-e2e"

[tasks.auth-build]
description = "Build the auth package."
run = "aube -C auth run build"

[tasks.auth-audit]
description = "Audit production auth dependencies."
run = "aube -C auth audit --prod"

[tasks.alchemy-plan]
description = "Plan the production Cloudflare stack without applying changes."
run = "aube -C www run alchemy:plan"

[tasks.alchemy-deploy]
description = "Deploy the production Cloudflare stack through Alchemy."
run = "aube -C www run alchemy:deploy"

[tasks.native-artifact]
description = "Package a deterministic x86_64 native artifact."
run = "scripts/package-native-artifact.py --input ${NATIVE_ARTIFACT_INPUT:?set NATIVE_ARTIFACT_INPUT} --service ${NATIVE_ARTIFACT_SERVICE:?set NATIVE_ARTIFACT_SERVICE} --version ${NATIVE_ARTIFACT_VERSION:-0.1.0} --output ${NATIVE_ARTIFACT_DIR:-dist-bin/native}"

[tasks.native-contract-test]
description = "Run the sync-postgres boundary test (the native host contract tests live in sigiro-infra)."
# The sync-postgres boundary test was not wired into any gate, so the drop bug
# that aborted production on every boot could not have been caught by CI.
run = "python3 -m unittest tests.deployment.test_sync_postgres_boundary"

[tasks.admin-postgres-test]
description = "Reconcile the hosted admin schema against a TLS PostgreSQL 17 container (needs Docker)."
run = "scripts/test-admin-postgres.sh"

[tasks.install-hooks]
description = "Install hk's Git 2.54+ repository-local config hooks."
run = """
#!/usr/bin/env bash
set -euo pipefail
git_bin="$(command -v git)"
PATH="$(dirname "$git_bin"):$PATH" hk uninstall >/dev/null 2>&1 || true
if "$git_bin" config --local --get core.hooksPath >/dev/null; then
  "$git_bin" config --local --unset-all core.hooksPath
fi
version="$($git_bin version)"
version="${version#git version }"
major="${version%%.*}"
remainder="${version#*.}"
minor="${remainder%%.*}"
if (( major < 2 || (major == 2 && minor < 54) )); then
  echo "install-hooks: Git 2.54+ is required; refusing hk legacy script shims" >&2
  exit 1
fi
PATH="$(dirname "$git_bin"):$PATH" hk install --mise
"""

# The local dev stack (network, volumes, PostgreSQL 17 with mkcert TLS, RustFS,
# and the `sigiro` bucket) is an ALCHEMY stack — `www/alchemy.dev.run.ts`,
# stack `SigiroLocalDev` — not a hand-written compose file. Production was
# already Alchemy; local dev was the last surface written in a different
# language, so it drifted silently.
#
# The Alchemy CLI MUST be reached through `aube -C www run <script>`. Invoking
# `node_modules/.bin/alchemy` directly dies with
# `[TSCONFIG_ERROR] Failed to load tsconfig 'astro/tsconfigs/strict'`:
# `www/tsconfig.json` extends an Astro config and astro is not hoisted under
# aube's virtual store, so only aube's run resolution finds it.
#
# `scripts/dev-certs.sh` must run BEFORE the stack: the Postgres container
# bind-mounts `.dev/certs` and will not start without it.
[tasks.dev-up]
description = "Bring up the Alchemy local dev stack (Postgres + TLS, RustFS, bucket)."
run = """
#!/usr/bin/env bash
set -euo pipefail
scripts/dev-certs.sh
aube -C www run alchemy:dev:deploy
"""

[tasks.dev-down]
description = "Destroy the Alchemy local dev stack, including its named volumes."
run = "aube -C www run alchemy:dev:destroy"

[tasks.dev-plan]
description = "Plan the Alchemy local dev stack without applying changes."
run = "aube -C www run alchemy:dev:plan"

[tasks.run]
description = "Run sigiro locally with dev dependencies (Postgres, RustFS)."
# The stack is deliberately left UP on exit. `alchemy destroy` is the only
# teardown verb and it also removes the named volumes, which is not what the
# old `docker compose down` (containers only, data kept) did. Leaving it
# running preserves the catalog between runs; `mise run dev-down` tears it down.
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run dev-up
nix run . -- serve
"""
