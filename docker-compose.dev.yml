services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: sigiro
      POSTGRES_PASSWORD: sigiro
    # TLS is not optional dressing: `storage.rs::validate_hosted_catalog_tls`
    # refuses any hosted catalog URL that is not sslmode=verify-full with an
    # sslrootcert, so a plaintext dev Postgres cannot exercise the hosted
    # storage path at all. `scripts/dev-certs.sh` issues .dev/certs from a local
    # mkcert root; the key has to be 0600 and owned by `postgres` INSIDE the
    # container, which a read-only host bind cannot provide — hence the copy.
    # Non-TLS clients still connect: `ssl=on` offers TLS, pg_hba does not force it.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        install -d -o postgres -g postgres -m 0750 /certs
        install -o postgres -g postgres -m 0644 /certs-src/server.crt /certs/server.crt
        install -o postgres -g postgres -m 0600 /certs-src/server.key /certs/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/certs/server.crt \
          -c ssl_key_file=/certs/server.key
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./.dev/certs:/certs-src:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigiro"]
      interval: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      retries: 5

  rustfs-setup:
    image: rustfs/rc:v0.1.30@sha256:1296510ec27800668d26a8bdca6251e587086187a9368c7b80134a169e8a3bb8
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin;
      rc bucket create --ignore-existing local/sigiro;
      "

volumes:
  pg-data:
  rustfs-data:
