services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: sigiro
      POSTGRES_PASSWORD: sigiro
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigiro"]
      interval: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      retries: 5

  rustfs-setup:
    image: rustfs/rc:v0.1.30@sha256:1296510ec27800668d26a8bdca6251e587086187a9368c7b80134a169e8a3bb8
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin;
      rc bucket create --ignore-existing local/sigiro;
      "

volumes:
  pg-data:
  rustfs-data:
