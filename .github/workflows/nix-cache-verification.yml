name: Shared Nix cache verification

on:
  push:
    branches: [chore/nix-shared-cache]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            extra-substituters = https://akshat-sigiro-builds.cachix.org https://github.com/akshatagarwl/duckdb-static/releases/download/nix-cache
            extra-trusted-public-keys = akshat-sigiro-builds.cachix.org-1:YjaKP3P+EoMjSjDAN1yI5U5dbZr5l9yNI5qeFphJvA8= duckdb-static.github.akshatagarwl-1:1yQ0flJ3vpCoIicGqSTO8gHezxiCOj2M0VLyJXXqQVQ=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: akshat-sigiro-builds
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          installCommand: nix profile add .#cache-client
          # extra_nix_config already lists this cache. `cachix use` would write a
          # user-level `substituters =` that drops the duckdb-static cache.
          skipAddingSubstituter: true
      - name: Require PC-built outputs without compiling
        run: |
          nix build --max-jobs 0 --no-link -L \
            .#rust-deps .#rust-workspace-deps .#rust-wasm-deps \
            .#unbundled .#checks.x86_64-linux.test
      - name: Run the cached executable
        run: |
          binary="$(nix eval --raw .#unbundled.outPath)/bin/sigiro"
          "$binary" --version
          "$binary" openapi > "$RUNNER_TEMP/openapi.json"
          nix develop --command python3 -c 'import json, os; spec=json.load(open(os.environ["RUNNER_TEMP"] + "/openapi.json")); assert spec["paths"]; assert spec["openapi"]'
      - name: Build a CI-only automatic upload probe
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          probe=$(nix build --no-link --print-out-paths --impure --expr '
            let
              project = builtins.getFlake (toString ./.);
              pkgs = import project.inputs.nixpkgs { system = builtins.currentSystem; };
              runId = builtins.getEnv "GITHUB_RUN_ID";
            in pkgs.runCommand "sigiro-cache-ci-probe" {} "echo ${runId} > $out"
          ')
          printf 'CI_PROBE_STORE_PATH=%s\n' "$probe"
