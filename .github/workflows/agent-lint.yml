name: Agent package checks
on:
  pull_request:
    paths:
      - "agents/agent/**"
      - "agents/cloudflare-sandbox/**"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - ".github/workflows/agent-lint.yml"
  push:
    branches: [main]
    paths:
      - "agents/agent/**"
      - "agents/cloudflare-sandbox/**"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - ".github/workflows/agent-lint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - uses: jdx/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945
        with:
          version: 2.2.16
      - run: aube -C agents/agent install --frozen-lockfile
      - run: aube -C agents/agent run typecheck
      - run: aube -C agents/agent run test:optimizer:cloudflare
      - run: aube -C agents/agent run build
      - run: aube -C agents/cloudflare-sandbox install --frozen-lockfile
      - run: aube -C agents/cloudflare-sandbox run typecheck
      - run: aube -C agents/cloudflare-sandbox exec wrangler deploy --dry-run
