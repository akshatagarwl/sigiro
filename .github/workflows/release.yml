name: Release

# A v* tag builds the four CLI archives and publishes them, with SHA256SUMS, as
# a GitHub Release. A manual run builds and uploads workflow artifacts only.
#
# tag-on-main.yml also calls this workflow (workflow_call) right after it pushes
# the tag, because a tag pushed with GITHUB_TOKEN starts no workflow run. In a
# called run github.ref is main, so every step reads the tag from
# preflight.outputs.tag instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The v<version> tag to build and publish. It must already exist.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Fails in seconds if the tag does not name the version in Cargo.toml, before
  # the matrix spends an hour of macOS minutes on a release whose archives would
  # carry the wrong version. No secrets: this workflow only publishes a GitHub
  # Release. sigiro.com/dl is written by sigiro-infra alone, which copies each
  # published release into R2 after checking these same checksums.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      # Empty for a manual run off a branch: build only, never publish.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          case "$tag" in ""|v*) ;; *) echo "::error::release tag '$tag' must start with v"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag || github.sha }}
      - name: Tag matches Cargo.toml
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$cargo_version" != "${TAG#v}" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $cargo_version"
            exit 1
          fi
      # A published version is never rebuilt or replaced: archives already on
      # sigiro.com/dl and in users' SHA256SUMS would stop matching.
      - name: Not released yet
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG is already released; a version is never re-released"
            exit 1
          fi

  build:
    needs: preflight
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each built natively by Nix (flake.nix). The Linux binaries are fully
        # static (musl) and run on any distribution; the macOS one links only
        # the system's libraries. nixpkgs no longer supports x86_64-darwin, so
        # Intel Macs are not a release target.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            system: x86_64-linux
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            system: aarch64-linux
          - target: aarch64-apple-darwin
            os: macos-15
            system: aarch64-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag || github.sha }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          # DuckDB comes prebuilt from duckdb-static's cache (flake.nix).
          extra_nix_config: |
            extra-substituters = https://akshat-sigiro-builds.cachix.org https://github.com/akshatagarwl/duckdb-static/releases/download/nix-cache
            extra-trusted-public-keys = akshat-sigiro-builds.cachix.org-1:YjaKP3P+EoMjSjDAN1yI5U5dbZr5l9yNI5qeFphJvA8= duckdb-static.github.akshatagarwl-1:1yQ0flJ3vpCoIicGqSTO8gHezxiCOj2M0VLyJXXqQVQ=

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: akshat-sigiro-builds
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          installCommand: nix profile add .#cache-client

      # `sigiro --version` names the commit (flake.nix passes it in).
      - name: Build
        run: nix build -L .#sigiro

      - name: Portable
        run: nix build -L '.#checks.${{ matrix.system }}.portable'

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            # A manual run off a branch builds and uploads workflow artifacts
            # only; it never publishes, so the name just has to be unique.
            version="0.0.0-${GITHUB_SHA::9}"
          fi
          name="sigiro-${version}-${TARGET}.tar.gz"
          # -C so the archive holds a bare `sigiro`, not a path. The installer
          # looks for exactly that. COPYFILE_DISABLE keeps macOS tar from
          # adding AppleDouble entries.
          COPYFILE_DISABLE=1 tar -czf "$name" -C result/bin sigiro
          [ "$(tar -tzf "$name")" = sigiro ] || { echo "::error::$name must hold exactly one file, sigiro"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

  # Tags only: a manual run stops after the build. GitHub Releases are the
  # source of truth for a version; sigiro-infra's nightly driver promotes each
  # new one to sigiro.com/dl/<version>/ and then moves LATEST.
  publish:
    needs: [preflight, build]
    if: needs.preflight.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One file, every archive, written the way `sha256sum -c` and the
      # installer's `grep` both read it.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          count="$(find . -maxdepth 1 -name "*.tar.gz" | wc -l)"
          [ "$count" -eq 3 ] || { echo "::error::expected 3 archives, found $count"; exit 1; }
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "sigiro ${TAG#v}" --generate-notes
