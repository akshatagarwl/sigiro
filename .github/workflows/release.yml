name: Release

# Tags and manual releases verify release-mode tests before building artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  MISE_TASK_CACHE_DIR: ${{ github.workspace }}/.mise-task-cache

jobs:
  # Fails in seconds if the R2 credentials are missing, before the matrix spends
  # an hour of macOS minutes compiling DuckDB from source for a release that
  # cannot be uploaded. v0.1.0 was cut by hand precisely because these secrets
  # were not set; tagging without them should cost nothing, not an hour.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: R2 credentials present
        env:
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          missing=''
          [ -n "$KEY" ]     || missing="$missing R2_ACCESS_KEY_ID"
          [ -n "$SECRET" ]  || missing="$missing R2_SECRET_ACCESS_KEY"
          [ -n "$ACCOUNT" ] || missing="$missing R2_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing repo secrets:$missing — set them, or publish by hand (see docs/notes/roadmap.md item 30)"
            exit 1
          fi

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.4
          install: false
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0
      - name: Restore successful gate receipts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.MISE_TASK_CACHE_DIR }}
          key: mise-task-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            mise-task-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned toolchain
        run: mise install rust sccache "packslip:github.com/jdx/mr-boxington" "cargo:cargo-shear" "github:astral-sh/hawk" ast-grep "cargo:similarity-rs" "cargo:tokei"
      - name: Run release gate
        run: mise run --skip-tools release

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest. A gnu binary will not start against a
          # glibc older than the one it linked against, so the runner's glibc is
          # the oldest distro we support: 22.04 is 2.35, and -latest (24.04) is
          # 2.39, which would silently drop Debian 12 and Ubuntu 22.04 users.
          # Lower the floor further with musl, not with a newer runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.4
          install: false
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0
      - name: Install pinned build tools
        run: |
          mise install rust sccache "packslip:github.com/jdx/mr-boxington"
          mise exec -- rustup target add "${{ matrix.target }}"

      - name: Cross-compilation toolchain
        if: matrix.cross
        uses: eclipse-score/apt-install@v1.0.0
        with:
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          apt_update: true

      - name: DuckDB static libs
        env:
          DUCKDB_STATIC_CACHE: ${{ runner.temp }}/duckdb-static
        run: |
          set -euo pipefail
          eval "$(scripts/prepare-duckdb-static.sh '${{ matrix.target }}')"
          {
            echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR"
            echo "DUCKDB_INCLUDE_DIR=$DUCKDB_INCLUDE_DIR"
            echo "DUCKDB_STATIC=1"
            echo "DUCKDB_STATIC_CACHE=$DUCKDB_STATIC_CACHE"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: mise run --skip-tools build

      # No UPX here, unlike the image. Compression buys nothing on a download
      # the reader does once, costs a decompression stub on every start, and is
      # a standing false-positive trigger for endpoint scanners — a bad trade
      # for a binary a human puts on their laptop.
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="sigiro-${version}-${TARGET}.tar.gz"
          # -C so the archive holds a bare `sigiro`, not a path. The installer
          # looks for exactly that.
          tar -czf "$name" -C "target/${TARGET}/release" sigiro
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One file, every archive, written the way `sha256sum -c` and the
      # installer's `grep` both read it.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      # Upload versioned artifacts BEFORE LATEST. LATEST is what the installer
      # reads first, so if it names a version whose archives are not up yet,
      # every install in that window fails. Write the pointer last and this
      # cannot happen.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          aws s3 cp dist "s3://sigiro-dl/${version}/" \
            --endpoint-url "$ENDPOINT" --recursive --no-progress
          printf '%s' "$version" > LATEST
          aws s3 cp LATEST s3://sigiro-dl/LATEST \
            --endpoint-url "$ENDPOINT" --content-type text/plain --no-progress
