name: Release

# A v* tag builds the four CLI archives and publishes them, with SHA256SUMS, as
# a GitHub Release. A manual run builds and uploads workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  # Fails in seconds if the tag does not name the version in Cargo.toml, before
  # the matrix spends an hour of macOS minutes on a release whose archives would
  # carry the wrong version. No secrets: this workflow only publishes a GitHub
  # Release. sigiro.com/dl is written by sigiro-infra alone, which copies each
  # published release into R2 after checking these same checksums.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  build:
    needs: preflight
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest. A gnu binary will not start against a
          # glibc older than the one it linked against, so the runner's glibc is
          # the oldest distro we support: 22.04 is 2.35, and -latest (24.04) is
          # 2.39, which would silently drop Debian 12 and Ubuntu 22.04 users.
          # Lower the floor further with musl, not with a newer runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.9
          install_args: rust sccache packslip:github.com/jdx/mr-boxington packslip:github.com/aubepkg/aube
      # `mise run build` builds the dashboard and the docs the binary embeds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Restore mbx build cache
        uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
        with:
          cache-generation: v1-${{ matrix.target }}
      # mise.toml's rust pin already lists every release target; this only
      # asserts it. MISE_DISABLE_TOOLS keeps `mise exec` from installing the
      # DuckDB CLI, which the build does not use and which has no asset for
      # these runners at the pinned version.
      - name: Rust target installed
        env:
          MISE_DISABLE_TOOLS: duckdb
        run: mise exec -- rustup target add "${{ matrix.target }}"

      - name: Cross-compilation toolchain
        if: matrix.cross
        uses: eclipse-score/apt-install@bd30e2e74a4850389719cb8c3e312bb26aada4e0 # v1.0.0
        with:
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          apt_update: true

      - name: DuckDB static libs
        env:
          DUCKDB_STATIC_CACHE: ${{ runner.temp }}/duckdb-static
        run: |
          set -euo pipefail
          eval "$(scripts/prepare-duckdb-static.sh '${{ matrix.target }}')"
          {
            echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR"
            echo "DUCKDB_INCLUDE_DIR=$DUCKDB_INCLUDE_DIR"
            echo "DUCKDB_STATIC=1"
            echo "DUCKDB_STATIC_CACHE=$DUCKDB_STATIC_CACHE"
          } >> "$GITHUB_ENV"

      # ci.yml's reason applies here too: libduckdb-sys puts the C++ runtime
      # before the static archive, so repeat it at the end of the link line.
      - name: Linux link flags
        if: contains(matrix.target, 'linux')
        run: echo 'RUSTFLAGS=-C link-arg=-lstdc++' >> "$GITHUB_ENV"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # `sigiro --version` names the commit as well as the version.
          export SIGIRO_BUILD_COMMIT="${GITHUB_SHA::9}"
          mise run --skip-tools build

      # No UPX here, unlike the image. Compression buys nothing on a download
      # the reader does once, costs a decompression stub on every start, and is
      # a standing false-positive trigger for endpoint scanners — a bad trade
      # for a binary a human puts on their laptop.
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # A manual run off a branch builds and uploads workflow artifacts
            # only; it never publishes, so the name just has to be unique.
            version="0.0.0-${GITHUB_SHA::9}"
          fi
          name="sigiro-${version}-${TARGET}.tar.gz"
          # -C so the archive holds a bare `sigiro`, not a path. The installer
          # looks for exactly that. COPYFILE_DISABLE keeps macOS tar from
          # adding AppleDouble entries.
          COPYFILE_DISABLE=1 tar -czf "$name" -C "target/${TARGET}/release" sigiro
          [ "$(tar -tzf "$name")" = sigiro ] || { echo "::error::$name must hold exactly one file, sigiro"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

  # Tags only: a manual run stops after the build. GitHub Releases are the
  # source of truth for a version; sigiro-infra's nightly driver promotes each
  # new one to sigiro.com/dl/<version>/ and then moves LATEST.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One file, every archive, written the way `sha256sum -c` and the
      # installer's `grep` both read it.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          count="$(find . -maxdepth 1 -name "*.tar.gz" | wc -l)"
          [ "$count" -eq 4 ] || { echo "::error::expected 4 archives, found $count"; exit 1; }
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "sigiro ${GITHUB_REF_NAME#v}" --generate-notes
