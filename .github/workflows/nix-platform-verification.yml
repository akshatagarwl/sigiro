name: Nix platform verification

# Builds and checks sigiro natively on every release system, including each
# Linux container image, on every push to main. The binary embeds the commit, so
# every commit is a new build; caching each one means `nix build` (and the NixOS
# module) at any main commit downloads instead of compiling. Once all systems
# pass, the commit's image is published as ghcr.io/akshatagarwl/sigiro:sha-<sha>.
# Version tags and `latest` stay with the Release workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-platform-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            extra-substituters = https://akshat-sigiro-builds.cachix.org https://github.com/akshatagarwl/duckdb-static/releases/download/nix-cache
            extra-trusted-public-keys = akshat-sigiro-builds.cachix.org-1:YjaKP3P+EoMjSjDAN1yI5U5dbZr5l9yNI5qeFphJvA8= duckdb-static.github.akshatagarwl-1:1yQ0flJ3vpCoIicGqSTO8gHezxiCOj2M0VLyJXXqQVQ=
            max-jobs = 2
            cores = 3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: akshat-sigiro-builds
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          installCommand: nix profile add .#cache-client
          # extra_nix_config already lists this cache. `cachix use` would write a
          # user-level `substituters =` that drops the duckdb-static cache.
          skipAddingSubstituter: true
      - name: Verify native platform
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          uname -sm
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
          df -h
      - name: Full application build
        run: nix build .#sigiro -L
      - name: Native tests, lint, formatting and portability
        run: nix flake check --keep-going -L
      - name: Executable smoke test
        run: |
          set -euo pipefail
          ./result/bin/sigiro --version
          ./result/bin/sigiro --help
          ./result/bin/sigiro openapi > "$RUNNER_TEMP/openapi.json"
          nix develop --command python3 -c 'import json, os; spec=json.load(open(os.environ["RUNNER_TEMP"] + "/openapi.json")); assert spec["paths"]; assert spec["openapi"]'
          nix develop --command python3 -m unittest tests.deployment.test_sync_postgres_boundary
      - name: Development linker smoke tests
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/linker-smoke.sh" <<'SCRIPT'
          set -euo pipefail
          printf 'fn main() { println!("linker smoke passed"); }\n' > "$RUNNER_TEMP/main.rs"
          linker_var="CARGO_TARGET_$(printf '%s' "$CARGO_BUILD_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          "${!linker_var}" -Wl,--version
          rustc --edition 2024 --target "$CARGO_BUILD_TARGET" -C relocation-model=static -C "linker=${!linker_var}" "$RUNNER_TEMP/main.rs" -o "$RUNNER_TEMP/linker-smoke"
          "$RUNNER_TEMP/linker-smoke"
          SCRIPT
          for linker in default mold wild; do
            nix develop ".#$linker" --command bash "$RUNNER_TEMP/linker-smoke.sh"
          done
      # This system's image starts and reports ready on its own architecture.
      # `nix flake check` already checked its config and contents.
      - name: Image health
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          nix run .#image.copyToDockerDaemon
          image="$(nix eval --raw .#image.imageRefUnsafe)"
          docker run -d --name sigiro "$image"
          status=starting
          for _ in $(seq 90); do
            status="$(docker inspect -f '{{.State.Health.Status}}' sigiro)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs sigiro
          [ "$status" = healthy ] || { echo "::error::image did not become healthy ($status)"; exit 1; }
          docker inspect -f '{{.Os}}/{{.Architecture}}' "$image"
      - name: Package verified executable
        env:
          SYSTEM: ${{ matrix.system }}
        run: COPYFILE_DISABLE=1 tar -czf "sigiro-$SYSTEM.tar.gz" -C result/bin sigiro
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sigiro-${{ matrix.system }}
          path: sigiro-${{ matrix.system }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Assembling the image only copies the binaries the matrix just cached: no
  # QEMU, no Docker build. GITHUB_TOKEN can write the package because it is
  # linked to this repository.
  publish-image:
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            extra-substituters = https://akshat-sigiro-builds.cachix.org https://github.com/akshatagarwl/duckdb-static/releases/download/nix-cache
            extra-trusted-public-keys = akshat-sigiro-builds.cachix.org-1:YjaKP3P+EoMjSjDAN1yI5U5dbZr5l9yNI5qeFphJvA8= duckdb-static.github.akshatagarwl-1:1yQ0flJ3vpCoIicGqSTO8gHezxiCOj2M0VLyJXXqQVQ=
      # Substitute-only: never a rebuild (or emulation) on this runner.
      - name: Fetch binaries
        run: nix build -L --max-jobs 0 .#packages.x86_64-linux.sigiro .#packages.aarch64-linux.sigiro
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          nix run .#publish-image -- "ghcr.io/akshatagarwl/sigiro:sha-${GITHUB_SHA::12}"
