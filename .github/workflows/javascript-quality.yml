name: JavaScript and TypeScript quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Check JavaScript and TypeScript with pinned tools
        run: |
          nix develop .#javascript --command bash -euo pipefail -c '
            pnpm install --frozen-lockfile
            pnpm -C auth install --frozen-lockfile
            pnpm -C www install --frozen-lockfile
            pnpm -C dashboard install --frozen-lockfile
            pnpm -C dashboard run typecheck
            pnpm run fmt:check
            pnpm run lint
          '
