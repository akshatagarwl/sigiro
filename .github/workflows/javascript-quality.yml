name: JavaScript and TypeScript quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - uses: jdx/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945
        with:
          version: 2.2.16
      - run: aube install --frozen-lockfile
      - run: aube -C auth install --frozen-lockfile
      - run: aube -C www install --frozen-lockfile
      - run: aube run fmt:check
      - run: aube run lint
