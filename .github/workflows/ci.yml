name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Tasks live in mise.toml. `install: false` on purpose: mise.toml pins a
      # rust and an sccache that the two actions below already provide with GHA
      # caching, and `mise install` would build a second, uncached copy of each.
      # The tasks themselves need no tool from mise — only `mise run`.
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: mise install "packslip:github.com/jdx/hk@1.58.1"
      - run: mise run check
      - run: mise run build
      - uses: eclipse-score/apt-install@v1.0.0
        with:
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          apt_update: true
      - run: TARGET=aarch64-unknown-linux-gnu mise run build
      - uses: docker/setup-buildx-action@v3
      - run: mise run image -- --set "*.tags=ghcr.io/sigiroai/sigiro:${{ github.sha }}" --set "*.cache-from=type=gha" --set "*.cache-to=type=gha,mode=max"
