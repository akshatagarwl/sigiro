name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- All cargo work: build + test + lint + aarch64, then upload binary ---
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release

      - name: Rustfmt
        uses: actions-rust-lang/rustfmt@v1

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build aarch64
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigiro-binaries
          path: |
            target/release/sigiro
            target/aarch64-unknown-linux-gnu/release/sigiro
          retention-days: 1

  # --- Package binary into Docker (uses pre-built binary, no compilation) ---
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: sigiro-binaries
          path: bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64, linux/arm64/v8
          dockerfile: Dockerfile.minimal
          file: Dockerfile.minimal
          tags: |
            ghcr.io/${{ github.repository }}/sigiro:${{ github.sha }}
            ${{ github.event_name == 'push' && 'ghcr.io/${{ github.repository }}/sigiro:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
