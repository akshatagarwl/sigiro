name: CI
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # libduckdb-sys places its C++ runtime before the static archive. Repeat it at
  # the end of rustc's linker arguments so archive references are resolved.
  RUSTFLAGS: "-C link-arg=-lstdc++"
  SCCACHE_GHA_ENABLED: "true"
  MISE_TASK_CACHE_DIR: ${{ github.workspace }}/.mise-task-cache
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.4
          install: false
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0
      - name: Restore successful gate receipts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.MISE_TASK_CACHE_DIR }}
          key: mise-task-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            mise-task-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned toolchain
        run: mise install rust sccache "packslip:github.com/jdx/mr-boxington"
      # Linux deliberately uses DuckDB's prebuilt static archive rather than the
      # bundled feature (Cargo.toml). The gate needs it before its first Rust command.
      - name: DuckDB static libs
        env:
          DUCKDB_STATIC_CACHE: ${{ runner.temp }}/duckdb-static
        run: |
          set -euo pipefail
          eval "$(scripts/prepare-duckdb-static.sh x86_64-unknown-linux-gnu)"
          {
            echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR"
            echo "DUCKDB_INCLUDE_DIR=$DUCKDB_INCLUDE_DIR"
            echo "DUCKDB_STATIC=1"
          } >> "$GITHUB_ENV"
      - run: mise run --skip-tools gate

  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    env:
      ENVIRONMENT: test
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-bytes
      DATABASE_URL: postgresql://sigiro:sigiro-kill-test@127.0.0.1:55432/sigiro_auth
      SIGIRO_RESOURCE: http://127.0.0.1:9999
      AUTH_TEST_OTP: "123456"
      EMAIL_FROM: noreply@sigiro.com
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:up
      - run: bun run migrate
      - run: bun run test
      - run: docker build -t sigiro-auth:ci .
      - run: bun audit --production
      - if: always()
        run: bun run db:down

  image:
    needs: [gate, auth]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.4
          install: false
      - uses: docker/setup-buildx-action@v3
      - name: Verify Docker image
        run: mise run --skip-tools image -- --set "*.tags=ghcr.io/sigiroai/sigiro:${{ github.sha }}" --set "*.cache-from=type=gha" --set "*.cache-to=type=gha,mode=max"
