name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - run: cargo build --release --locked

      - run: cargo test --release

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - uses: actions-rust-lang/rustfmt@v1

      - name: Build aarch64
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu --locked

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64, linux/arm64/v8
          tags: |
            ghcr.io/${{ github.repository }}/sigiro:${{ github.sha }}
            ${{ github.event_name == 'push' && 'ghcr.io/${{ github.repository }}/sigiro:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
