name: CI
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # libduckdb-sys places its C++ runtime before the static archive. Repeat it at
  # the end of rustc's linker arguments so archive references are resolved.
  RUSTFLAGS: "-C link-arg=-lstdc++"
  SCCACHE_GHA_ENABLED: "true"
  MISE_TASK_CACHE_DIR: ${{ github.workspace }}/.mise-task-cache
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.4
          install: false
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0
      - name: Restore successful gate receipts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.MISE_TASK_CACHE_DIR }}
          key: mise-task-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            mise-task-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned toolchain
        run: mise install rust sccache "packslip:github.com/jdx/mr-boxington" "cargo:cargo-shear" "github:astral-sh/hawk" ast-grep "cargo:similarity-rs" "cargo:tokei"
      # Linux deliberately uses DuckDB's prebuilt static archive rather than the
      # bundled feature (Cargo.toml). The gate needs it before its first Rust command.
      - name: DuckDB static libs
        env:
          DUCKDB_VERSION: 1.5.5
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/duckdb/amd64"
          work_dir="$RUNNER_TEMP/duckdb-static-amd64"
          mkdir -p "$install_dir" "$work_dir"
          cd "$work_dir"
          curl -fSL --retry 3 \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/static-libs-linux-amd64.zip" \
            -o static-libs.zip
          unzip -q static-libs.zip
          test -f libduckdb_static.a && test -f duckdb.h
          { echo "create merged.a"; for archive in *.a; do echo "addlib $archive"; done; echo save; echo end; } | ar -M
          ranlib merged.a
          cp merged.a "$install_dir/libduckdb_static.a"
          cp duckdb.h "$install_dir/"
          {
            echo "DUCKDB_LIB_DIR=$install_dir"
            echo "DUCKDB_INCLUDE_DIR=$install_dir"
            echo "DUCKDB_STATIC=1"
          } >> "$GITHUB_ENV"
      - run: mise run --skip-tools gate

  image:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.4
          install: false
      - uses: docker/setup-buildx-action@v3
      - name: Verify Docker image
        run: mise run --skip-tools image -- --set "*.tags=ghcr.io/sigiroai/sigiro:${{ github.sha }}" --set "*.cache-from=type=gha" --set "*.cache-to=type=gha,mode=max"
