name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: just check
      - run: just build
      - uses: eclipse-score/apt-install@v1.0.0
        with:
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          apt_update: true
      - run: TARGET=aarch64-unknown-linux-gnu just build
      - uses: docker/setup-buildx-action@v3
      - run: just image
      - if: github.event_name == 'push'
        run: docker buildx bake sigiro --push --set "*.tags=ghcr.io/${{ github.repository }}/sigiro:${{ github.sha }}" --set "*.cache-from=type=gha" --set "*.cache-to=type=gha,mode=max"
