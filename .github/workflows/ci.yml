name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # libduckdb-sys places its C++ runtime before the static archive. Repeat it at
  # the end of rustc's linker arguments so archive references are resolved.
  RUSTFLAGS: "-C link-arg=-lstdc++"
  MISE_TASK_CACHE_DIR: ${{ github.workspace }}/.mise-task-cache
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.9
          install_args: rust sccache packslip:github.com/jdx/mr-boxington
      - name: Restore mbx build cache
        uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
        with:
          save-on-workflow-dispatch: "true"
      - name: Restore successful gate receipts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MISE_TASK_CACHE_DIR }}
          key: mise-task-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            mise-task-v2-${{ runner.os }}-${{ runner.arch }}-

      # Linux deliberately uses DuckDB's prebuilt static archive rather than the
      # bundled feature (Cargo.toml). The gate needs it before its first Rust command.
      - name: DuckDB static libs
        env:
          DUCKDB_STATIC_CACHE: ${{ runner.temp }}/duckdb-static
        run: |
          set -euo pipefail
          eval "$(scripts/prepare-duckdb-static.sh x86_64-unknown-linux-gnu)"
          {
            echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR"
            echo "DUCKDB_INCLUDE_DIR=$DUCKDB_INCLUDE_DIR"
            echo "DUCKDB_STATIC=1"
          } >> "$GITHUB_ENV"
      - run: mise run --skip-tools full

  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: jdx/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          version: 2.8.4
      - run: aube install --frozen-lockfile
      # Auth runs on Workers/D1, so there is no PostgreSQL to start. Keep CI to
      # static checks and generate the D1 schema from the Drizzle artifact.
      - run: aube run check
      - run: aube run schema:sql
      - run: aube audit --prod

  image:
    needs: [gate, auth]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify Docker image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          targets: sigiro
          set: |
            sigiro.tags=ghcr.io/sigiroai/sigiro:${{ github.sha }}
            sigiro.cache-from=type=gha
            sigiro.cache-to=type=gha,mode=max
