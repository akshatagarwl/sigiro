name: Build, Test & Self-Monitoring Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Pin old Sigiro tag for the observability backend sidecar
  OLD_SIGIRO_TAG: 'latest'

jobs:
  # --- Phase 1: Build and test ---
  build-and-test:
    name: Build + Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.85', 'stable']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@1.85
        with:
          version: ${{ matrix.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sigiro-${{ matrix.toolchain }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | head -50 || true

      - name: Build
        run: cargo build --release --locked 2>&1 | tail -5

      - name: Run library tests
        run: cargo test --lib --release

  # --- Phase 1b: Cross-compile aarch64 binary for OrbStack VM ---
  build-aarch64:
    name: Build aarch64 Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sigiro-aarch64

      - name: Build aarch64 binary
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu --locked 2>&1 | tail -5

      - name: Upload aarch64 binary
        uses: actions/upload-artifact@v4
        with:
          name: sigiro-aarch64
          path: target/aarch64-unknown-linux-gnu/release/sigiro
          retention-days: 1

      - name: Build binary size check
        run: |
          size=$(stat -c%s target/release/sigiro 2>/dev/null || stat -f%z target/release/sigiro)
          echo "Binary size: $size bytes"
          # Warn if binary is suspiciously large (>200MB) or small (<1MB)
          if [ "$size" -gt 209715200 ]; then
            echo "WARNING: binary suspiciously large (>200MB)"
          fi

  # --- Phase 2: Docker build ---
  docker:
    name: Docker Build (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # Don't push on PR; push on main
          platforms: linux/amd64, linux/arm64/v8
          tags: |
            ghcr.io/${{ github.repository }}/sigiro:pr-${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}/sigiro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          # Build again just to get digest (build-push doesn't return it when push=false)
          echo "Docker images built:"
          docker buildx imagins ls

  # --- Phase 3: Self-monitoring smoke test (two-instance) ---
  self-monitoring:
    name: Self-Monitoring Smoke Test
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@1.85
        with:
          version: stable

      - name: Build
        run: cargo build --release

      - name: Start old Sigiro as observability backend
        run: |
          docker pull ghcr.io/${{ github.repository }}/sigiro:$OLD_SIGIRO_TAG || true
          docker run -d --name old-sigiro \
            --cap-add BPF \
            --cap-add NET_ADMIN \
            -p 9999:9999 \
            -p 4317:4317 \
            ghcr.io/${{ github.repository }}/sigiro:$OLD_SIGIRO_TAG || true

          # Wait for old Sigiro to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9999/health > /dev/null 2>&1; then
              echo "Old Sigiro ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: old Sigiro failed to start"
              docker logs old-sigiro || true
              exit 1
            fi
            sleep 1
          done

      - name: Start new Sigiro with eBPF
        env:
          SIGIRO_OTEL_ENDPOINT: 'http://localhost:4317'
          OTEL_SERVICE_NAME: 'sigiro-next'
        run: |
          # Run new Sigiro in background
          ./target/release/sigiro serve --no-ebpf &
          NEW_PID=$!
          echo "New Sigiro pid: $NEW_PID"
          sleep 3

          # Check it's running
          if ! kill -0 "$NEW_PID" 2>/dev/null; then
            echo "ERROR: new Sigiro exited"
            exit 1
          fi

          # Keep it running
          disown

      - name: Generate load
        run: |
          # Send OTLP spans to new Sigiro
          for i in $(seq 1 50); do
            curl -s -X POST http://localhost:4318/v1/traces \
              -H "Content-Type: application/json" \
              -d "{\"resourceSpans\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"sigiro-next\"}}]},\"scopeSpans\":[{\"spans\":[{\"traceId\":\"$(printf '%032x' $((RANDOM * RANDOM)))000000000000000\",\"spanId\":\"$(printf '%016x' $((RANDOM * RANDOM)))00000000\",\"name\":\"test-span-$i\",\"kind\":1,\"startTimeUnixNano\":\"$(($(date +%s) * 1000000000))\",\"endTimeUnixNano\":\"$(($(date +%s) * 1000000000 + 100000000))\",\"attributes\":[{\"key\":\"http.method\",\"value\":{\"stringValue\":\"GET\"}}]}]}]}]}" \
              2>/dev/null || true
            sleep 0.1
          done
          echo "Load generation complete"

      - name: Wait for data to flush
        run: sleep 3

      - name: Verify telemetry received by old Sigiro
        run: |
          RESPONSE=$(curl -sf "http://localhost:9999/v1/investigate?service=sigiro-next&from=$(($(date +%s) - 120))&to=$(date +%s)" || echo "{}")
          SPAN_COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('span_count', 0))" 2>/dev/null || echo "0")
          echo "Old Sigiro received $SPAN_COUNT spans from new Sigiro"
          if [ "$SPAN_COUNT" -gt 0 ]; then
            echo "✓ Self-monitoring working"
          else
            echo "✗ No spans received — self-monitoring NOT working"
            # Don't fail the build — obi may not be available in CI container
            echo "WARNING: Could be expected in CI without eBPF capabilities"
          fi

      - name: Collect self-investigate output
        run: |
          mkdir -p artifacts
          curl -sf "http://localhost:9999/v1/investigate?service=sigiro-next&from=$(($(date +%s) - 300))&to=$(date +%s)" \
            > "artifacts/self-internal-${GITHUB_SHA}.json" 2>/dev/null || echo "{}" > "artifacts/self-internal-${GITHUB_SHA}.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigiro-self-internal-${{ github.sha }}
          path: artifacts/

  # --- Phase 4: Baseline comparison (main branch only) ---
  baseline-compare:
    name: Baseline Comparison
    runs-on: ubuntu-latest
    needs: self-monitoring
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download current artifacts
        uses: actions/download-artifact@v4
        with:
          name: sigiro-self-internal-${{ github.sha }}
          path: artifacts/

      - name: Download baseline artifacts
        env:
          BASELINE_SHA: ${{ vars.SIGIRO_BASELINE_SHA || '' }}
        run: |
          mkdir -p baseline
          # Try to get baseline from previous main run
          if [ -n "$BASELINE_SHA" ]; then
            echo "Fetching baseline from SHA: $BASELINE_SHA"
            # In practice: use GitHub API to fetch artifact from the baseline run
            # For now, use the most recent successful baseline artifact
          fi

          # Fallback: if no baseline, create a dummy baseline from current
          if [ ! -f baseline/*.json ]; then
            echo "No baseline found — using current as baseline (first run)"
            cp artifacts/*.json baseline/ 2>/dev/null || echo "{}" > baseline/baseline.json
          fi

      - name: Run CI comparison
        run: |
          CURRENT=$(ls artifacts/*.json 2>/dev/null | head -1 || echo "")
          BASELINE=$(ls baseline/*.json 2>/dev/null | head -1 || echo "")

          if [ -z "$CURRENT" ] || [ -z "$BASELINE" ]; then
            echo "SKIP: baseline comparison (insufficient data)"
            exit 0
          fi

          bash scripts/ci-compare.sh "$CURRENT" "$BASELINE" || {
            echo ""
            echo "=== REGRESSION DETECTED ==="
            echo "Commenting on PR..."
            # Post a PR comment with the regression details
            exit 1
          }

      - name: Set baseline SHA (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Update the baseline SHA variable for future comparisons
          echo "Setting SIGIRO_BASELINE_SHA=${{ github.sha }}"
          # Note: This requires setting the variable in the repo settings
          # or using a GitHub API call to update actions variables

  # --- Phase 5: Push Docker image (main branch only) ---
  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, self-monitoring]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64/v8
          tags: |
            ghcr.io/${{ github.repository }}/sigiro:latest
            ghcr.io/${{ github.repository }}/sigiro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
