name: Tag and release

# On every push to main: when package.json carries a version that has no
# v<version> tag yet (a release PR just merged), tag the commit and publish the
# release in this same run. Otherwise nothing happens.
#
# The tag is pushed with GITHUB_TOKEN, and a GITHUB_TOKEN push starts no
# workflows, so release.yml's tag trigger would not fire. This run calls
# release.yml directly instead. A manually pushed v* tag still starts
# release.yml through its own tag trigger. No App, PAT or repository setting
# is needed.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, never cancelled: a run that has pushed a tag must finish
# releasing it.
concurrency:
  group: tag-and-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      # Plain node, no dependencies: the script only reads files and runs git.
      - name: Tag v<version> if it is new
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          node scripts/tag-release.mjs

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
