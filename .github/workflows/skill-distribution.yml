name: Skill distribution

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - '.github/workflows/skill-distribution.yml'
      - 'scripts/check-skill-distribution.sh'
      - 'skills'
      - 'www/blume.config.ts'
      - 'www/bun.lock'
      - 'www/package.json'
  pull_request:
    branches: [main]
    paths:
      - '.gitmodules'
      - '.github/workflows/skill-distribution.yml'
      - 'scripts/check-skill-distribution.sh'
      - 'skills'
      - 'www/blume.config.ts'
      - 'www/bun.lock'
      - 'www/package.json'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: bash scripts/check-skill-distribution.sh local
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/check-skill-distribution.sh remote
