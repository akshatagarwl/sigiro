<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 32" fill="none">
  <!--
    Sigiro mark — Eye / Iris (C)
    Chosen logo direction.

    Eye outline: watchful, attentive. Iris in accent color.
    Legible at small sizes. Classic but refined.
  -->
  <!-- Eye outline -->
  <ellipse cx="17" cy="16" rx="14" ry="10" stroke="#1C1916" stroke-width="2"/>
  <!-- Iris -->
  <circle cx="17" cy="16" r="5" fill="#C4501A"/>
  <!-- Highlight -->
  <circle cx="19" cy="14" r="1.5" fill="#F7F4EF"/>
</svg>
